<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIV - Astonishing Image Viewer</title>
<meta name="description" content="Astonishing Image Viewer: un gestore di immagini per Android dalle prestazioni eccezionali, con zoom gestuale, lettura precisa di file enormi, convertitore e cestino.">
<meta name="author" content="Rocco Casadei, a.k.a. Roccobot">
<meta name="color-scheme" content="light dark">
<!--
  QUESTA PAGINA È LA SORGENTE, e quella che si legge sul sito è la sua COPIA:
  il workflow di rilascio di Roccobot/AIV la copia in
  roccobot.github.io/AIV/index.html a ogni tag. Si modifica QUI, mai là, o il
  tag successivo sovrascrive la modifica.

  ⚠️ IL PASSO 13 COPIA DUE COSE, non una: questa pagina e la cartella
  `publish/schermate/` che le sta accanto. Chi aggiunge un'immagine qui deve
  guardare anche là, o sul sito resta un riquadro rotto.

  ⚠️⚠️ NON C'È PIÙ NESSUN SEGNAPOSTO DA SOSTITUIRE, e fino alla 1.36 ce n'erano
  cinque (__APK__, __VERSION__, __SIZE__, __DATE__, __YEAR__) che il passo 13 di
  `release.yml` riempiva con `sed`. Adesso versione, nome del file e peso
  arrivano da UNA chiamata all'API di GitHub al caricamento della pagina, come
  chiede il brief dei disegni: la pagina non invecchia più fra due tag, e il
  workflow torna a fare una copia e nient'altro. Chi rimettesse un segnaposto
  qui dovrebbe rimettere anche il `sed` là.

  ⚠️⚠️ LE NOTE DI RILASCIO NON CI SONO PIÙ, tolte su richiesta dell'utente il
  2026-09-02 (*presa da GitHub non è abbastanza user friendly*), e con loro il
  parser che rendeva leggibili i bullet, la data e il collegamento a tutte le
  versioni. La chiamata all'API RESTA, perché serve al tasto: quello che è uscito
  è il `body` della release, cioè l'unica cosa che qui dentro arrivava scritta da
  fuori. Chi le rimettesse rimetta anche il parser: i bullet veri cominciano col
  numero di versione e portano URL nudi e code 'by @tizio in ...'.

  ⚠️ LA VESTE È QUELLA DEL DESIGN SYSTEM, e il documento di riferimento è
  'AIV: pagina di download' di Claude Design (progetto 'Roccobot Design'): copy
  italiano e inglese parola per parola, struttura, misure e colori. I colori sono
  i token di `tokens/colors.css` COPIATI qui, perché una pagina statica su Pages
  non può linkare il design system; sono gli stessi di `Theme.kt` e di
  `colors.xml` dell'app, e non se ne inventano altri.

  ⚠️ IL TESTO STA IN UN DIZIONARIO E IL DOM È UNO SOLO, mentre il documento di
  Design porta due blocchi gemelli (uno per lingua). Il risultato reso è lo
  stesso; qui una frase vive in un posto solo, e le due lingue non possono
  divergere in silenzio.

  ⚠️ MAI `innerHTML`: ogni testo entra con `textContent` e i nodi si compongono
  a mano (regola non derogabile del repo, ed è il canale classico delle
  iniezioni). ⚠️ Adesso che le note sono uscite, da fuori arrivano solo il nome e
  il peso dell'apk, ma la regola non si allenta per questo: vale sempre.
-->
<style>
  /* ── I token del design system, copiati da tokens/colors.css ── */
  :root{
    /* ⚠️⚠️ `color-scheme` STA ANCHE QUI, e non basta il `<meta>` in testa: quello
       dichiara che la pagina sa fare tutti e due i temi, e lascia scegliere al
       sistema. Da quando c'è il tasto, la scelta può essere dell'utente, e senza
       queste due righe le barre di scorrimento e i comandi di serie del browser
       resterebbero del tema di SISTEMA anche col tema della pagina forzato: cioè
       una pagina scura con la barra chiara. */
    color-scheme:light;
    --brand-accent:#43B59E;
    --brand-accent-dark:#00727B;
    --brand-glyph:#EBFFF7;
    --brand-glyph-dark:#4FD9BE;
    --brand-link-light:#0B6B5B;
    --brand-link-dark:#4FD9BE;

    --light-back:#FCFBF8;
    --light-surface-container:#F8F7F4;
    --light-surface-variant:#EFEEEA;
    --light-ink:#1A1C1B;
    --light-ink-variant:#5B6360;
    --light-outline:#79817D;
    --light-outline-variant:#DAD9D5;

    --dark-back:#151B1A;
    --dark-surface-container:#1E2523;
    --dark-surface-variant:#2A312F;
    --dark-ink:#E4E9E7;
    --dark-ink-variant:#A9B3B0;
    --dark-outline:#8A9490;
    --dark-outline-variant:#3C4442;

    --bg:var(--light-back);
    --surface-container:var(--light-surface-container);
    --surface-variant:var(--light-surface-variant);
    --text-body:var(--light-ink);
    --text-muted:var(--light-ink-variant);
    --text-link:var(--brand-link-light);
    --accent:var(--brand-accent);
    --on-accent:#00382F;
    --outline:var(--light-outline);
    --outline-variant:var(--light-outline-variant);
    /* ⚠️ IL GLIFO SEGUE L'APP, che ha una `values-night/` sua (`#EBFFF7` su
       `#43B59E`, `#4FD9BE` su `#00727B`): cambia col tema, e con lui tutto
       quello che porta la coppia dell'icona, cioè l'icona in testa, il tasto di
       download e la firma nel piede.
       ⚠️⚠️ IL TASTO E LA FIRMA PRIMA NO, ed è la richiesta dell'utente del
       2026-09-02 (*sempre la stessa coppia di colori dell'icona, sia su tema
       chiaro che su tema scuro*). Il tasto teneva `--brand-glyph` in tutti e due
       i temi, come fissava il brief dei disegni, quindi sul tema scuro era
       `#EBFFF7` su `#00727B` mentre l'icona accanto era `#4FD9BE` sullo stesso
       fondo; la firma aveva i due colori chiari SCRITTI IN ESADECIMALE dentro
       l'SVG, quindi sul tema scuro restava la piastrella chiara. Un'istruzione
       della sessione vale più del brief, e questa non si torna a cambiare.
       ⚠️ Il token giusto è `--brand-glyph-dark` e non `--brand-link-dark`, che
       oggi ha lo stesso valore ma dice un'altra cosa (i link). */
    --glyph:var(--brand-glyph);
    /* ⚠️ L'ombra della schermata è un token perché sul fondo scuro un'ombra NERA
       non si vede: là al suo posto (accanto, per la verità) c'è un alone del
       colore dell'accento, che è il 'bagliore' chiesto dall'utente.
       ⚠️⚠️ **ALLEGGERITE TUTTE E TRE DEL 25% NELLA 1.46** (richiesta dell'utente,
       2026-09-03: *vedo un'ombra (chiaro) e/o un bagliore (scuro) troppo opachi,
       alleggerisci un pelo*). Erano `0,20` sul chiaro, `0,55` e `0,12` sullo scuro.
       ⚠️ **La stessa frazione su tutte e tre e non tre numeri scelti a occhio**: sono
       la stessa cosa vista su due temi, quindi un ritocco che cambi il rapporto fra
       loro cambierebbe il disegno invece di alleggerirlo. */
    --ombra-schermata:0 12px 30px rgba(0,0,0,0.15);
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:var(--dark-back);
    --surface-container:var(--dark-surface-container);
    --surface-variant:var(--dark-surface-variant);
    --text-body:var(--dark-ink);
    --text-muted:var(--dark-ink-variant);
    --text-link:var(--brand-link-dark);
    --accent:var(--brand-accent-dark);
    --on-accent:#FFFFFF;
    --outline:var(--dark-outline);
    --outline-variant:var(--dark-outline-variant);
    --glyph:var(--brand-glyph-dark);
    --ombra-schermata:0 12px 34px rgba(0,0,0,0.41), 0 0 26px rgba(79,217,190,0.09);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text-body);
    font-family:Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:var(--text-link); text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .foglio{max-width:960px; width:100%; margin:0 auto; padding:24px 24px 0}
  /* ⚠️ LE DUE COLONNE SONO ALTE UGUALI (nessun `align-items:start`), e serve al
     paragrafo dell'installazione: sta in fondo alla sua colonna, quindi il suo
     bordo inferiore va a filo con quello della schermata. Chiesto dall'utente il
     2026-09-02. Se un domani la colonna di sinistra diventasse la più alta, il
     filo si perde da sé: là sotto non c'è più spazio da distribuire. */
  .alto{display:grid; grid-template-columns:1fr auto; gap:48px}
  .parole{display:flex; flex-direction:column; gap:20px; max-width:34rem}
  .icona{border-radius:24%; display:block}
  h1{font-size:40px; line-height:1.1; letter-spacing:-0.02em; font-weight:500; margin:0}
  .claim{font-size:18px; line-height:1.55; color:var(--text-muted); margin:0}
  .blocco-scarica{display:flex; flex-direction:column; gap:10px; align-items:flex-start; flex:1}
  .scarica{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--accent); color:var(--glyph);
    font-size:16px; font-weight:500; padding:14px 24px; border-radius:12px;
    box-shadow:0 3px 6px rgba(0,0,0,0.18);
  }
  .scarica:hover{text-decoration:none; filter:brightness(1.06)}
  .tecnica{font-size:13px; color:var(--text-muted); font-variant-numeric:tabular-nums}
  .tecnica .minuta{opacity:0.72}
  .installa{font-size:13px; line-height:1.6; color:var(--text-muted); opacity:0.7; max-width:44ch; margin-top:auto}

  /* ── La schermata dell'app, che è VERA dal 2026-09-02 ──
     Prima qui c'era un mockup disegnato in CSS: una cornice di telefono con
     quindici quadretti segnaposto, perché il design system non ha fotografie e la
     pagina non se ne inventava. Adesso ci sono le due schermate che ha mandato
     l'utente, chiara e scura. */
  .schermata-blocco{display:flex; flex-direction:column; align-items:center}
  .schermata-blocco img{
    display:block; width:280px; height:auto; border-radius:22px;
    border:1px solid var(--outline-variant); box-shadow:var(--ombra-schermata);
  }

  .fatti{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 40px; padding:56px 0 0; max-width:840px}
  /* ⚠️⚠️ **IL GLIFO È CENTRATO SULLA PRIMA RIGA DEL TITOLO, e prima era appoggiato al
     bordo di sopra della riga** (segnalazione dell'utente, 2026-09-03: *le icone dei 6
     paragrafetti-highlights... secondo me sono troppo in basso*). Aveva ragione, ed è
     aritmetica: con `align-items:flex-start` il glifo e la prima riga partono dallo stesso
     punto, e il glifo è più alto della riga, quindi il suo centro cade più in basso di
     mezza differenza. Misurato prima di toccare niente: lo scarto fra i due centri era
     **+3,00px identico su tutte e sei**.
     ⚠️ **Il numero è DERIVATO e non scelto**, ed è la ragione per cui corpo e interlinea
     del titolo sono dichiarati qui come proprietà: chi cambia una delle tre misure non
     deve ricalcolare niente a mano, perché il `calc` lo fa. Un valore scritto a mano si
     scollerebbe al primo ritocco del corpo del testo.
     ⚠️ **E NON è una compensazione** (le coppie di margini di segno opposto che le regole
     vietano): è un margine solo, su un lato solo, che dichiara dove sta il glifo. */
  .fatto{
    display:flex; gap:14px; align-items:flex-start;
    --glifo:24px; --titolo-corpo:15px; --titolo-interlinea:1.2;
  }
  .fatto svg{
    flex:none; color:var(--accent);
    width:var(--glifo); height:var(--glifo);
    margin-top:calc((var(--titolo-corpo) * var(--titolo-interlinea) - var(--glifo)) / 2);
  }
  .fatto .testi{display:flex; flex-direction:column; gap:3px}
  .fatto .titolo{font-size:var(--titolo-corpo); line-height:var(--titolo-interlinea); font-weight:500}
  .fatto .corpo{font-size:14px; line-height:1.5; color:var(--text-muted)}

  footer{max-width:960px; width:100%; margin:56px auto 0; padding:0 24px 32px}
  .piede-riga{
    /* ⚠️ `nowrap`: firma a sinistra e tasti a destra sulla STESSA riga, come ha
       chiesto l'utente, e adesso a OGNI larghezza di telefono.
       ⚠️⚠️ **SOTTO LA SOGLIA CI STA PERCHE LA FIRMA SI ACCORCIA AL SOLO NOME**
       (richiesta dell'utente, 2026-09-04), e prima quel caso andava in colonna:
       la colonna era il rimedio a una firma che non entrava, non una scelta di
       disegno, e togliere la causa costa meno che curare l'effetto.
       ⚠️ Le misure sono prese col carattere di RIPIEGO (DejaVu Sans), che e il
       piu largo della pila e quello su cui era tarata la soglia; dichiararlo
       serve a poterle confrontare con quelle di domani. La firma intera vuole
       216, piu 24 di respiro, piu 141 di tasti e 48 di rientro: 429px di
       finestra. Col solo nome ne vuole 93, e il caso piu largo dei tasti (pagina
       italiana, 'Tema chiaro' con 'English') 144: 309px in tutto. Con Roboto,
       che e il carattere vero sul telefono, ne bastano 290. */
    border-top:1px solid var(--outline-variant); padding-top:18px;
    display:flex; flex-wrap:nowrap; gap:12px 24px; align-items:center; justify-content:space-between;
  }
  /* ⚠️ 460 e non 429: la soglia sta sopra la misura perche i caratteri non si
     rendono identici su tutti i sistemi, e fra 429 e 460 la firma corta non
     costa niente. */
  @media (max-width:460px){
    /* ⚠️ Sparisce il preambolo, non il nome: il collegamento a roccobot.me resta,
       e con lui la firma. */
    .firma-lunga{display:none}
  }
  /* ⚠️⚠️ **LA COLONNA TORNA SOTTO I 305px, e non e un ripensamento**: li sotto non
     ci sta piu nemmeno la firma corta, e `.piede-tasti` porta `flex:none` mentre
     'Roccobot' e una parola sola che non va a capo, quindi la riga sborderebbe in
     orizzontale. Senza questa regola la firma corta avrebbe TOLTO la colonna anche
     dove serviva davvero.
     ⚠️ **305 e la misura presa nel browser**: col carattere di ripiego, che
     e il piu largo della pila, la riga chiede 305,2px nel caso peggiore (pagina
     inglese, 92,0 di firma piu 141,3 di tasti piu 24 di respiro e 48 di rientro).
     Il caso italiano ne chiede 300,6.
     ⚠️ **Sotto i 300px la pagina sborda comunque, e NON e colpa del piede**: il
     difetto c'era gia prima di questa modifica, misurato sulla pagina di partenza
     (20px a 300, 40px a 280) col piede gia in colonna. Sta altrove, e chi lo
     cerca non lo cerchi qui. */
  @media (max-width:305px){
    .piede-riga{flex-direction:column; align-items:flex-start; gap:14px}
  }
  .firma{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted)}
  /* ⚠️ I DUE TASTI STANNO IN UN CONTENITORE LORO, e non sono due figli del piede:
     così restano attaccati fra loro a destra della firma, con un respiro fra loro
     più piccolo di quello che li separa da lei. Sciolti, `space-between` li
     avrebbe spinti ai due capi e la lingua non sarebbe più stata a destra. */
  .piede-tasti{display:flex; flex:none; gap:16px; align-items:center}
  /* ⚠️ I DUE TASTI HANNO LA STESSA VESTE, e sono due collegamenti di solo testo:
     l'utente lo ha chiesto così (2026-09-03, *dev'essere un link solo testo 'Tema
     chiaro' / 'Tema scuro' e corrispettivi ENG*). */
  .lingua,.tema{
    font:inherit; font-size:13px; color:var(--text-muted); background:none; border:0;
    border-bottom:1px dotted var(--outline); padding:0 0 1px; cursor:pointer;
  }
  .lingua:hover,.tema:hover{color:var(--text-body)}

  /* ══ IL TELEFONO: testata affiancata e il resto centrato ═══════════════════
     Disegno scelto dall'utente il 2026-09-02 fra tre mockup. In testa l'icona a
     sinistra e il titolo a destra su due righe allineate a sinistra; sotto,
     centrati, il tasto (più grande), la riga tecnica su tre righe e la schermata
     larga quanto il testo. Il claim e il paragrafo dell'installazione restano
     allineati a sinistra: sono gli unici due blocchi di testo lungo, e centrati
     si leggono peggio.
     ⚠️ `display:contents` SCIOGLIE I DUE CONTENITORI (`.parole` e
     `.blocco-scarica`), così i loro figli diventano voci della griglia e si
     collocano uno per uno: senza, l'icona e il titolo non potrebbero stare
     affiancati, e la schermata non potrebbe salire sopra il paragrafo
     dell'installazione, che le sta dentro.
     ⚠️ GLI `order` SERVONO PROPRIO A QUELLO: nel DOM la schermata viene dopo il
     paragrafo, e qui va prima.
     ⚠️ LA SOGLIA È 880 E NON 760, ed è una misura: fino a 880px la schermata
     resta la colonna più alta e il paragrafo dell'installazione le va a filo,
     sotto no (a 870 sfora di 6px, a 780 di 33).
     ⚠️ E LA SCHERMATA NON SPARISCE PIÙ: prima era `display:none`, perché il
     mockup di un telefono su un telefono vero non aggiunge niente. Vale per un
     mockup, non per una schermata vera. */
  @media (max-width:880px){
    .alto{display:grid; grid-template-columns:auto 1fr; gap:18px 16px; align-items:center}
    .parole, .blocco-scarica{display:contents}

    .icona{order:1; grid-column:1; grid-row:1; width:88px; height:88px}
    h1{order:2; grid-column:2; grid-row:1; font-size:30px; text-align:left}
    .claim{order:3; grid-column:1 / -1}
    .scarica{order:4; grid-column:1 / -1; justify-self:center;
      font-size:18px; padding:16px 30px; border-radius:14px}
    .tecnica{order:5; grid-column:1 / -1; text-align:center; line-height:1.8}
    .schermata-blocco{order:6; grid-column:1 / -1}
    .installa{order:7; grid-column:1 / -1; margin-top:2px; max-width:none}

    /* la riga tecnica va a capo prima di 'Android' e prima di 'codice sorgente' */
    .tecnica .sep{display:none}
    .tecnica .pezzo{display:block}

    /* ⚠️⚠️ DA BORDO A BORDO SUL TELEFONO, e prima non lo era (riscontro dell'utente,
       2026-09-03: `da bordo a bordo? Sì, ma dovrebbe essere già così`). Il `width:100%`
       era la larghezza della COLONNA, cioè 24px di rientro per lato: la schermata
       sembrava a filo e non lo era. I margini negativi la portano fuori dal rientro
       del `.foglio`, e i due numeri sono lo stesso 24 di là: chi cambia quello cambi
       anche questi, o la schermata sfora o resta rientrata.
       ⚠️ NON è una compensazione (le due coppie vietate di segno opposto): è un
       elemento che esce da un contenitore rientrato, e i due margini sono lo stesso
       gesto sui due lati. */
    .schermata-blocco img{
      width:calc(100% + 48px); max-width:none;
      margin-left:-24px; margin-right:-24px;
      /* ⚠️ Bordo, stondamento e ombra vanno via TUTTI E TRE, e per la stessa ragione:
         sono i segni che dicono 'questa immagine finisce qui', e a filo di schermo si
         vedrebbero solo sopra e sotto, cioè come due righe fuori posto su un lato solo.
         Restano sopra 880px, dove la schermata è un oggetto in mezzo alla pagina. */
      border:0; border-radius:0; box-shadow:none
    }
    .fatti{grid-template-columns:1fr; padding-top:40px}
  }
</style>
</head>
<body>

<main class="foglio">
  <div class="alto">
    <div class="parole">
      <!-- L'icona dell'app, e il tracciato è QUELLO VERO, copiato da
           `res/drawable/ic_launcher_foreground.xml`: il disco e la A col tratto
           già incorporato nel contorno e il controcampo tenuto aperto da
           `evenodd`. Sta nelle coordinate del master, cioè senza la scala 0,65
           del drawable, perché quella serve solo a un'icona adattiva, di cui si
           vedono i 72dp centrali su 108; qui la piastrella si vede tutta.
           ⚠️ La coppia di colori segue il tema come l'icona vera, che ha una
           `values-night/` sua: non si fissa il glifo chiaro. -->
      <svg class="icona" viewBox="0 0 108 108" width="88" height="88" aria-hidden="true">
        <rect width="108" height="108" fill="var(--accent)"></rect>
        <path d="M30,19a10,10 0 1,0 0,20a10,10 0 1,0 0,-20z" fill="var(--glyph)"></path>
        <path fill="var(--glyph)" fill-rule="evenodd" d="M58.1311,27.1833L88.1311,71.1833A5,5 0 0 1 84,79L24,79A5,5 0 0 1 19.8689,71.1833L49.8689,27.1833A5,5 0 0 1 58.1311,27.1833ZM56.0424,49.5583L68.0424,66.5583A2.5,2.5 0 0 1 66,70.5L42,70.5A2.5,2.5 0 0 1 39.9576,66.5583L51.9576,49.5583A2.5,2.5 0 0 1 56.0424,49.5583Z"></path>
      </svg>
      <h1>Astonishing Image Viewer</h1>
      <p class="claim" id="claim"></p>
      <div class="blocco-scarica">
        <a class="scarica" id="scarica" href="https://github.com/Roccobot/AIV/releases/latest" download>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 3.5v11.2M12 15.6l4.4-4.4M12 15.6L7.6 11.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M4.4 18.8h15.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          <span id="scarica-testo"></span>
        </a>
        <div class="tecnica" id="tecnica"></div>
        <div class="installa" id="installa"></div>
      </div>
    </div>

    el('installa').textContent = T.installa;
    el('schermata').alt = T.schermataAlt;

    // ⚠️ Il tasto porta all'apk della release; senza apk allegato porta alla
    // release stessa invece di rompersi, come chiede il brief.
    var tasto = el('scarica');
    el('scarica-testo').textContent = T.scarica + (rel ? ' ' + rel.tag : '');
    tasto.href = asset ? asset.browser_download_url
      : (rel ? rel.pagina : 'https://github.com/' + REPO + '/releases/latest');
    if (asset) tasto.setAttribute('download', ''); else tasto.removeAttribute('download');

    // ⚠️ Nome e peso ci sono SOLO se c'è l'apk allegato, e senza di lui la riga
    // si accorcia invece di riempirsi di trattini: prima nominava un file
    // ricavato dal tag, cioè un file che nessuno può scaricare.
    // ⚠️ TRE PEZZI E DUE SEPARATORI, e non una stringa sola: sul telefono la riga
    // va a capo prima di 'Android' e prima di 'codice sorgente' (richiesta
    // dell'utente), e per farlo i pezzi devono essere nodi che il CSS possa
    // rendere blocchi. Su schermo largo il risultato è identico a prima.
    var tecnica = el('tecnica');
    svuota(tecnica);
    var sorgente = document.createElement('a');
    sorgente.href = 'https://github.com/' + REPO;
    sorgente.textContent = T.sorgente;
    // ⚠️ La versione di Android porta una classe sua: è il pezzo meno importante
    // dei tre, e l'utente l'ha voluta un filo più trasparente delle altre.
    var righe = [];
    if (asset) righe.push([asset.name + ' \u00B7 ' + peso(asset.size, T.loc), '']);
    righe.push([T.android, ' minuta'], [sorgente, '']);
    for (var r = 0; r < righe.length; r++) {
      if (r) {
        var sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = ' \u00B7 ';
        tecnica.appendChild(sep);
      }
      var pz = document.createElement('span');
      pz.className = 'pezzo' + righe[r][1];
      if (typeof righe[r][0] === 'string') pz.textContent = righe[r][0]; else pz.appendChild(righe[r][0]);
      tecnica.appendChild(pz);
    }

    for (var f = 0; f < T.fatti.length; f++) {
      var titolo = document.querySelector('[data-t="f' + f + '"]');
      var corpo = document.querySelector('[data-c="f' + f + '"]');
      if (!titolo || !corpo) continue;
      titolo.textContent = T.fatti[f][0];
      corpo.textContent = T.fatti[f][1];
    }

    var tastoLingua = el('lingua');
    tastoLingua.textContent = T.altra;
    tastoLingua.title = T.titoloAltra;

    // ⚠️ Etichetta e titolo nominano il tema OPPOSTO a quello in vigore, cioè
    // quello che si ottiene toccando: vedi la nota sopra `stato.scelto`.
    var altro = (temaInVigore() === 'dark') ? 'light' : 'dark';
    var tastoTema = el('tema');
    tastoTema.textContent = T.temi[altro];
    tastoTema.title = T.titoliTema[altro];
  }

  /* ── Una sola chiamata a GitHub, e da lì tutto il resto ── */
  function leggiRelease() {
    fetch('https://api.github.com/repos/' + REPO + '/releases?per_page=1', {
      headers: { Accept: 'application/vnd.github+json' }
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (elenco) {
      var ultima = elenco && elenco[0];
      if (!ultima) throw new Error('nessuna release');
      var apk = null;
      var assets = ultima.assets || [];
      for (var i = 0; i < assets.length; i++) {
        if (/\.apk$/i.test(assets[i].name)) { apk = assets[i]; break; }
      }
      stato.rel = {
        tag: String(ultima.tag_name || '').replace(/^v/i, ''),
        asset: apk,
        pagina: ultima.html_url
      };
      disegna();
    }).catch(function () {
      // ⚠️ Senza risposta la pagina NON si rompe e non lo dice: il tasto resta
      // quello che era prima della chiamata, cioè porta alla release più recente
      // su GitHub. Prima qui si accendeva `stato.rotto`, che serviva solo a
      // scrivere una riga nelle note di rilascio, e quelle non ci sono più.
    });
  }

  el('lingua').addEventListener('click', function () {
    stato.lingua = (stato.lingua === 'it') ? 'en' : 'it';
    disegna();
  });

  el('tema').addEventListener('click', function () {
    // ⚠️ Da qui in poi la pagina NON segue più il sistema, fino al ricaricamento.
    stato.scelto = (temaInVigore() === 'dark') ? 'light' : 'dark';
    applicaTema();
    // ⚠️ Serve anche `disegna`, e non solo `applicaTema`: l'etichetta nomina il
    // tema opposto a quello in vigore, quindi si scambia a ogni tocco.
    disegna();
  });

  applicaTema();
  disegna();
  leggiRelease();
})();
</script>

</body>
</html>
