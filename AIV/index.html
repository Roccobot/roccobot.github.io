<!--
  L'ANTEPRIMA DEL LINK, dalla 2.92 (richiesta dell'utente, giro della 2.91: 'il
  mini-sito di AIV necessita di Immagine OpenGraph, Twitter e Telegram'). Chi
  condivide questo indirizzo vede accanto al link l'immagine, il titolo e la frase
  qui sotto, invece del solo indirizzo.

  ⚠️ VIVONO NEL SORGENTE E NON LI SCRIVE LO SCRIPT: chi legge queste righe (il
  programma di Telegram, di X, di WhatsApp) non esegue JavaScript, quindi un meta
  tag aggiunto al caricamento per loro non esisterebbe.

  ⚠️ GLI INDIRIZZI SONO ASSOLUTI, e devono esserlo: un'anteprima si legge fuori
  da questa pagina, dove un percorso relativo non vuol dire niente.

  ⚠️⚠️ DI X C'È SOLO `twitter:card`, E NON È UNA DIMENTICANZA: X legge prima i suoi
  campi e poi ripiega su quelli di Open Graph per titolo, descrizione e immagine,
  quindi scriverli due volte vorrebbe dire due copie da tenere uguali. Il tipo di
  scheda invece un ripiego non ce l'ha, e 'summary_large_image' è quello che
  mostra l'immagine grande.

  ⚠️ LA DESCRIZIONE È SCRITTA DUE VOLTE PER FORZA, qui sopra e in `og:description`:
  i motori di ricerca leggono la prima e i servizi di messaggi la seconda. Chi ne
  cambia una cambi anche l'altra.

  ⚠️ L'IMMAGINE È `publish/anteprima.jpg` E LA COMPONE `tools/og-image.py`, dalle
  cose che questa pagina porta già: l'icona qui sotto, il titolo, l'indirizzo di
  `og:url` e la schermata chiara. Chi cambia una di queste rilanci lo strumento.
-->

<!--
  IL GLIFO NUDO DELL'APP, IN #43B59E (richiesta dell'utente, giro della 1.46:
  'imposta il glifo nudo dell'app come favicon in colore #43B59E, che dovrebbe
  andare bene per entrambi i temi del browser').

  ⚠️ IL DISEGNO NON È RIFATTO QUI: i due tracciati sono quelli di
  app/src/main/res/drawable/ic_aiv_mark.xml, che a sua volta li prende byte per
  byte dall'icona approvata. Cambia il formato, non la geometria, e questo è il
  solo posto della pagina in cui c'è del disegno.

  ⚠️ LA TELA È 70x60 E NON UN QUADRATO, perché quella è l'area
  dell'inchiostro: 70 x 60 unità, misurate rendendo il disegno in Chromium (i
  limiti veri escono 0..70 e 0..60, cioè zero margine). Un quadrato vorrebbe
  dire aggiungere aria a una parte sola, e il browser il riquadro se lo fa da sé
  rispettando le proporzioni. È PIÙ LARGO CHE ALTO, e chi lo riusa deve saperlo.

  ⚠️ UN SOLO COLORE PER I DUE TEMI, come ha chiesto: un SVG può portarsi dentro
  la sua media query e cambiare tinta col tema del browser, e qui NON lo fa
  apposta. Se un giorno non risaltasse abbastanza sullo scuro, l'alternativa che
  ha già nominato è #4FD9BE.

  ⚠️ È INCORPORATO E NON UN FILE: la paginetta non dipende dagli asset del
  documento di feedback, e il disegno vive in un posto solo, che la prova
  PaginettaTest confronta con ic_aiv_mark.xml.

  ⚠️⚠️ NON È LA FAVICON DEL DOCUMENTO DI FEEDBACK (il blocco note col glifo,
  assets/feedback-favicon.*), che vale per il DF e le sue pagine di supporto. Il
  2026-10-02 questa riga era stata sostituita da quella, e l'utente l'ha
  segnalato il 2026-10-03: la paginetta non doveva cambiare favicon.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2070%2060'%3E%3Cg%20fill='%2343B59E'%20transform='translate(-19,-19)'%3E%3Cpath%20d='M30,19a10,10%200%201,0%200,20a10,10%200%201,0%200,-20z'/%3E%3Cpath%20fill-rule='evenodd'%20d='M58.1311,27.1833L88.1311,71.1833A5,5%200%200%201%2084,79L24,79A5,5%200%200%201%2019.8689,71.1833L49.8689,27.1833A5,5%200%200%201%2058.1311,27.1833ZM56.0424,49.5583L68.0424,66.5583A2.5,2.5%200%200%201%2066,70.5L42,70.5A2.5,2.5%200%200%201%2039.9576,66.5583L51.9576,49.5583A2.5,2.5%200%200%201%2056.0424,49.5583Z'/%3E%3C/g%3E%3C/svg%3E">
<!--
  QUESTA PAGINA LA PUBBLICA `pages.yml`, sul Pages di questo repository
  (roccobot.github.io/AIV/), a ogni push su `main` che tocca `publish/`.

  ⚠️ IL SITO È UN ELENCO DI FILE DA INCLUDERE, dalla 6.29: questa pagina,
  `privacy.html`, `anteprima.jpg`, la cartella `schermate/` e `assets/Roboto.ttf`
  con la sua licenza. Un file nuovo che la pagina usa va aggiunto all'elenco in
  `pages.yml`, e se manca `tools/site-check.py` ferma la pubblicazione.

  ⚠️⚠️ NESSUN SEGNAPOSTO DA SOSTITUIRE: versione, nome del file e peso arrivano
  da UNA chiamata all'API di GitHub al caricamento della pagina, quindi la pagina
  non invecchia fra due release e un rilascio non la ripubblica.

  ⚠️⚠️ LE NOTE DI RILASCIO NON CI SONO PIÙ, tolte su richiesta dell'utente il
  2026-09-02 (*presa da GitHub non è abbastanza user friendly*), e con loro il
  parser che rendeva leggibili i bullet, la data e il collegamento a tutte le
  versioni. La chiamata all'API RESTA, perché serve al tasto: quello che è uscito
  è il `body` della release, cioè l'unica cosa che qui dentro arrivava scritta da
  fuori. Chi le rimettesse rimetta anche il parser: i bullet veri cominciano col
  numero di versione e portano URL nudi e code 'by @tizio in ...'.

  ⚠️ LA VESTE È QUELLA DEL DESIGN SYSTEM, e il documento di riferimento è
  'AIV: pagina di download' di Claude Design (progetto 'Roccobot Design'): copy
  italiano e inglese parola per parola, struttura, misure e colori. I colori sono
  i token di `tokens/colors.css` COPIATI qui, perché una pagina statica su Pages
  non può linkare il design system; sono gli stessi di `Theme.kt` e di
  `colors.xml` dell'app, e non se ne inventano altri.

  ⚠️ IL TESTO È IN UN DIZIONARIO E IL DOM È UNO SOLO, mentre il documento di
  Design contiene due blocchi gemelli (uno per lingua). Il risultato reso è lo
  stesso; qui una frase vive in un posto solo, e le due lingue non possono
  divergere in silenzio.

  ⚠️ MAI `innerHTML`: ogni testo entra con `textContent` e i nodi si compongono
  a mano (regola non derogabile del repo, ed è il canale classico delle
  iniezioni). ⚠️ Adesso che le note non ci sono più, da fuori arrivano solo il nome e
  il peso dell'apk, ma la regola non si allenta per questo: vale sempre.
-->
<style>
  @font-face{font-family:Roboto;src:url("assets/Roboto.ttf") format("truetype");font-weight:100 900;font-display:swap}
  /* ── I token del design system, copiati da tokens/colors.css ── */
  :root{
    /* ⚠️⚠️ `color-scheme` STA ANCHE QUI, e non basta il `<meta>` in testa: quello
       dichiara che la pagina sa fare tutti e due i temi, e lascia scegliere al
       sistema. Da quando c'è il tasto, la scelta può essere dell'utente, e senza
       queste due righe le barre di scorrimento e i comandi di serie del browser
       resterebbero del tema di SISTEMA anche col tema della pagina forzato: cioè
       una pagina scura con la barra chiara. */
    color-scheme:light;
    --brand-accent:#43B59E;
    --brand-accent-dark:#00727B;
    --brand-glyph:#EBFFF7;
    --brand-glyph-dark:#4FD9BE;
    --brand-link-light:#0B6B5B;
    --brand-link-dark:#4FD9BE;

    --light-back:#FCFBF8;
    --light-surface-container:#F8F7F4;
    --light-surface-variant:#EFEEEA;
    --light-ink:#1A1C1B;
    --light-ink-variant:#5B6360;
    --light-outline:#79817D;
    --light-outline-variant:#DAD9D5;

    --dark-back:#151B1A;
    --dark-surface-container:#1E2523;
    --dark-surface-variant:#2A312F;
    --dark-ink:#E4E9E7;
    --dark-ink-variant:#A9B3B0;
    --dark-outline:#8A9490;
    --dark-outline-variant:#3C4442;

    --bg:var(--light-back);
    --surface-container:var(--light-surface-container);
    --surface-variant:var(--light-surface-variant);
    --text-body:var(--light-ink);
    --text-muted:var(--light-ink-variant);
    --text-link:var(--brand-link-light);
    --accent:var(--brand-accent);
    --on-accent:#00382F;
    --outline:var(--light-outline);
    --outline-variant:var(--light-outline-variant);
    /* ⚠️ IL GLIFO SEGUE L'APP, che ha una `values-night/` sua (`#EBFFF7` su
       `#43B59E`, `#4FD9BE` su `#00727B`): cambia col tema, e con lui tutto
       quello che porta la coppia dell'icona, cioè l'icona in testa, il tasto di
       download e la firma nel piede.
       ⚠️⚠️ IL TASTO E LA FIRMA PRIMA NO, ed è la richiesta dell'utente del
       2026-09-02 (*sempre la stessa coppia di colori dell'icona, sia su tema
       chiaro che su tema scuro*). Il tasto teneva `--brand-glyph` in tutti e due
       i temi, come fissava il brief dei disegni, quindi sul tema scuro era
       `#EBFFF7` su `#00727B` mentre l'icona accanto era `#4FD9BE` sullo stesso
       fondo; la firma aveva i due colori chiari SCRITTI IN ESADECIMALE dentro
       l'SVG, quindi sul tema scuro restava la piastrella chiara. Un'istruzione
       della sessione vale più del brief, e questa non si torna a cambiare.
       ⚠️ Il token giusto è `--brand-glyph-dark` e non `--brand-link-dark`, che
       oggi ha lo stesso valore ma dice un'altra cosa (i link). */
    --glyph:var(--brand-glyph);
    /* Sul fondo chiaro le schermate scure dell'app sono all'88% (richiesta dell'utente,
       2026-10-18: *sulle pagine 'bianche', l'immagine scura di AIV dev'essere all'88% di
       opacità*); sullo scuro quelle chiare sono al 94% (stesso giorno: *metti il chiaro
       sulla pagina scura al 94%*). */
    --opacita-schermata:0.88;
  }
  [data-theme="dark"]{
    --opacita-schermata:0.94;
    color-scheme:dark;
    --bg:var(--dark-back);
    --surface-container:var(--dark-surface-container);
    --surface-variant:var(--dark-surface-variant);
    --text-body:var(--dark-ink);
    --text-muted:var(--dark-ink-variant);
    --text-link:var(--brand-link-dark);
    --accent:var(--brand-accent-dark);
    --on-accent:#FFFFFF;
    --outline:var(--dark-outline);
    --outline-variant:var(--dark-outline-variant);
    --glyph:var(--brand-glyph-dark);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text-body);
    font-family:Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:var(--text-link); text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .foglio{max-width:960px; width:100%; margin:0 auto; padding:24px 24px 0}
  /* ══ LA TESTATA INCASTRATA NELL'IMMAGINE, dal 2026-10-18 (`Incastro`) ════════════
     (richiesta dell'utente: *incastrarle in mezzo al testo, con una parte dei paragrafi
     iniziali che vanno sullo spazio vuoto, armoniosamente*, e poi il suo mockup con *ci
     sta TUTTO: titolo, icona, paragrafetto, pulsante, note*). Un'immagine quadrata larga
     quanto la pagina, con due pannelli dell'app: uno in alto a destra e uno in basso a
     sinistra. Nel quadrato vuoto in alto a sinistra vivono l'icona col titolo, la
     descrizione, il tasto e la riga tecnica; la nota dell'installazione va sotto.
     Prima, dal 2026-09-02, qui c'era la schermata di un telefono in una colonna a destra.
     ⚠️ Gli spazi verticali e il corpo della descrizione (17 e non più 18 pixel) sono il
     suo mockup diviso per 1,78, la scala che dà la larghezza dell'immagine (1626 pixel
     là, 912 qui). */
  .testa{
    --icona:88px;
    display:grid; grid-template-columns:auto 1fr; column-gap:28px; align-items:center
  }
  .icona{border-radius:24%; display:block; width:var(--icona); height:var(--icona)}
  /* ⚠️ Due righe a ogni lingua: 7em lascia fuori 'Astonishing Image', che chiede
     circa 8em, e tiene 'Image Viewer'. */
  h1{font-size:40px; line-height:1.2; letter-spacing:-0.02em; font-weight:500; margin:0; max-width:7em}
  /* ⚠️ L'IMMAGINE E IL TESTO SONO NELLA STESSA CELLA DI UNA GRIGLIA, e il testo ha la
     larghezza del quadrato vuoto meno `--aria`, il respiro dai due pannelli. Una cella
     sola, e non un testo posizionato in assoluto, perché così la cella resta alta quanto
     il più alto dei due: se un giorno il testo sforasse, spingerebbe giù la pagina
     invece di finire sopra il pannello di sotto.
     ⚠️⚠️ `--vuoto` È UNA MISURA DELLE IMMAGINI, e non un numero scelto: il quadrato vuoto
     è 1330 pixel su 2530 di lato, in tutte e due, letto sul canale di trasparenza (prima,
     nelle copie da 2000 arrivate in chat, era 1051). Chi cambia le immagini lo rimisuri. */
  .incastro{--vuoto:52.57%; --aria:36px; display:grid}
  .incastro > *{grid-area:1 / 1}
  .parole{position:relative; z-index:1; align-self:start; width:calc(var(--vuoto) - var(--aria))}
  .claim{font-size:17px; line-height:1.55; color:var(--text-muted); margin:32px 0 0; text-wrap:pretty}
  .blocco-scarica{margin-top:32px; display:flex; flex-direction:column; align-items:flex-start; gap:16px}
  .scarica{
    display:inline-flex; align-items:center; gap:14px;
    background:var(--accent); color:var(--glyph);
    font-size:23px; font-weight:500; padding:20px 35px; border-radius:17px;
    box-shadow:0 3px 6px rgba(0,0,0,0.18);
  }
  .scarica svg{width:29px; height:29px}
  .scarica:hover{text-decoration:none; filter:brightness(1.06)}
  /* ⚠️ La riga tecnica va a capo prima di ogni pezzo su ogni schermo, dal 2026-10-10:
     prima lo faceva solo sul telefono. Dalla 6.61 non c'è più il pezzo 'codice sorgente',
     perché il repo del codice è privato (scelta Serratura-03-A). */
  .tecnica{font-size:13px; line-height:1.45; color:var(--text-muted); font-variant-numeric:tabular-nums}
  .tecnica .minuta{opacity:0.72}
  .tecnica .sep{display:none}
  .tecnica .pezzo{display:block}
  .installa{font-size:16.6px; line-height:1.6; color:var(--text-muted); opacity:0.7; max-width:44ch; margin-top:32px; text-wrap:pretty}

  /* ── Le immagini dell'app, che sono VERE dal 2026-09-02 ──
     Prima qui c'era un mockup disegnato in CSS: una cornice di telefono con
     quindici quadretti segnaposto, perché il design system non ha fotografie e la
     pagina non se ne inventava. Adesso ci sono le immagini che ha mandato l'utente,
     chiara e scura.
     ⚠️ NIENTE BORDO E NIENTE STONDAMENTO, che la schermata del telefono aveva: i due
     pannelli hanno gli angoli già disegnati nell'immagine, e il riquadro intero è in
     gran parte trasparente.
     ⚠️⚠️ NIENTE OMBRA E NIENTE BAGLIORE, E LE SCHERMATE SONO DEL TEMA OPPOSTO, dal
     2026-10-18 (scelta dell'utente, *si passa ai colori opposti*): sul fondo chiaro le
     schermate scure, sul fondo scuro quelle chiare, e il contrasto basta a staccarle.
     Prima c'era un `drop-shadow` per tema (un'ombra sul chiaro, un bagliore sullo
     scuro), e sullo scuro ogni versione provata, anche con la grana di un filtro SVG,
     faceva gradini visibili (banding) o non andava bene sulle due aree di colore così
     diverse delle schermate scure di AIV. Chi rimette un effetto lo sappia. */
  .schermata-blocco img{display:block; width:100%; height:auto; opacity:var(--opacita-schermata)}
  .selezione{display:none}

  /* Le tre sezioni (`Rinnovo`, 6.50): titolo, una riga d'introduzione e le schede. Il titolo
     riprende il corpo e il peso di quelli delle schede ingranditi, e l'introduzione la
     descrizione in alto, più piccola; `text-wrap:pretty` tiene le parole corte lontane dai
     capi delle righe. */
  .sezione{padding-top:56px; max-width:840px}
  .sezione h2{font-size:22px; line-height:1.25; font-weight:500; margin:0}
  .intro{font-size:15px; line-height:1.55; color:var(--text-muted); margin:6px 0 0; max-width:52ch; text-wrap:pretty}
  .fatti{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 40px; padding:24px 0 0; max-width:840px}
  /* `Nativa e scattante`, che da scheda è diventata una riga sola in fondo. */
  /* ⚠️⚠️ **IL GLIFO È CENTRATO SULLA PRIMA RIGA DEL TITOLO, e prima era appoggiato al
     bordo di sopra della riga** (segnalazione dell'utente, 2026-09-03: *le icone dei 6
     paragrafetti-highlights... secondo me sono troppo in basso*). Aveva ragione, ed è
     aritmetica: con `align-items:flex-start` il glifo e la prima riga partono dallo stesso
     punto, e il glifo è più alto della riga, quindi il suo centro cade più in basso di
     mezza differenza. Misurato prima di toccare niente: lo scarto fra i due centri era
     **+3,00px identico su tutte e sei**.
     ⚠️ **Il numero è DERIVATO e non scelto**, ed è la ragione per cui corpo e interlinea
     del titolo sono dichiarati qui come proprietà: chi cambia una delle tre misure non
     deve ricalcolare niente a mano, perché il `calc` lo fa. Un valore scritto a mano si
     scollerebbe al primo ritocco del corpo del testo.
     ⚠️ **E NON è una compensazione** (le coppie di margini di segno opposto che le regole
     vietano): è un margine solo, su un lato solo, che dichiara dov'è il glifo. */
  .fatto{
    display:flex; gap:14px; align-items:flex-start;
    --glifo:24px; --titolo-corpo:15px; --titolo-interlinea:1.2;
  }
  .fatto svg{
    flex:none; color:var(--accent);
    width:var(--glifo); height:var(--glifo);
    margin-top:calc((var(--titolo-corpo) * var(--titolo-interlinea) - var(--glifo)) / 2);
  }
  .fatto .testi{display:flex; flex-direction:column; gap:3px}
  .fatto .titolo{font-size:var(--titolo-corpo); line-height:var(--titolo-interlinea); font-weight:500}
  .fatto .corpo{font-size:14px; line-height:1.5; color:var(--text-muted); text-wrap:pretty}

  footer > nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 16px;margin-bottom:20px;font-size:15px}
  footer{max-width:960px; width:100%; margin:56px auto 0; padding:0 24px 32px}
  .piede-riga{
    /* ⚠️ `nowrap`: firma a sinistra e tasti a destra sulla STESSA riga, come ha
       chiesto l'utente, e adesso a OGNI larghezza di telefono.
       ⚠️⚠️ **SOTTO LA SOGLIA CI STA PERCHÉ LA FIRMA SI ACCORCIA AL SOLO NOME**
       (richiesta dell'utente, 2026-09-04), e prima quel caso andava in colonna:
       la colonna era il rimedio a una firma che non entrava, non una scelta di
       disegno, e togliere la causa costa meno che curare l'effetto.
       ⚠️ Le misure sono prese col carattere di RIPIEGO (DejaVu Sans), che è il
       più largo della pila e quello su cui era tarata la soglia; dichiararlo
       serve a poterle confrontare con quelle di domani. La firma intera vuole
       216, più 24 di respiro, più 141 di tasti e 48 di rientro: 429px di
       finestra. Col solo nome ne vuole 93, e il caso più largo dei tasti (pagina
       italiana, 'Tema chiaro' con 'English') 144: 309px in tutto. Con Roboto,
       che è il carattere vero sul telefono, ne bastano 290. */
    border-top:1px solid var(--outline-variant); padding-top:18px;
    display:flex; flex-wrap:nowrap; gap:12px 24px; align-items:center; justify-content:space-between;
  }
  /* ⚠️ 460 e non 429: la soglia è sopra la misura perché i caratteri non si
     rendono identici su tutti i sistemi, e fra 429 e 460 la firma corta non
     costa niente. */
  @media (max-width:460px){
    /* ⚠️ Sparisce il preambolo, non il nome: il collegamento a roccobot.me resta,
       e con lui la firma. */
    .firma-lunga{display:none}
  }
  /* ⚠️⚠️ **LA COLONNA TORNA SOTTO I 305px, e non è un ripensamento**: lì sotto non
     ci sta più nemmeno la firma corta, e `.piede-tasti` ha `flex:none` mentre
     'Roccobot' è una parola sola che non va a capo, quindi la riga sborderebbe in
     orizzontale. Senza questa regola la firma corta avrebbe TOLTO la colonna anche
     dove serviva davvero.
     ⚠️ **305 è la misura presa nel browser**: col carattere di ripiego, che
     è il più largo della pila, la riga chiede 305,2px nel caso peggiore (pagina
     inglese, 92,0 di firma più 141,3 di tasti più 24 di respiro e 48 di rientro).
     Il caso italiano ne chiede 300,6.
     ⚠️ **Sotto i 300px la pagina sborda comunque, e NON è colpa del piede**: il
     difetto c'era già prima di questa modifica, misurato sulla pagina di partenza
     (20px a 300, 40px a 280) col piede già in colonna. È altrove, e chi lo
     cerca non lo cerchi qui. */
  @media (max-width:305px){
    .piede-riga{flex-direction:column; align-items:flex-start; gap:14px}
  }
  .firma{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted)}
  /* ⚠️ I DUE TASTI SONO IN UN CONTENITORE LORO, e non sono due figli del piede:
     così restano attaccati fra loro a destra della firma, con un respiro fra loro
     più piccolo di quello che li separa da lei. Sciolti, `space-between` li
     avrebbe spinti ai due capi e la lingua non sarebbe più stata a destra. */
  .piede-tasti{display:flex; flex:none; gap:16px; align-items:center}
  /* ⚠️ I DUE TASTI HANNO LA STESSA VESTE, e sono due collegamenti di solo testo:
     l'utente lo ha chiesto così (2026-09-03, *dev'essere un link solo testo 'Tema
     chiaro' / 'Tema scuro' e corrispettivi ENG*). */
  .lingua,.tema{
    font:inherit; font-size:13px; color:var(--text-muted); background:none; border:0;
    border-bottom:1px dotted var(--outline); padding:0 0 1px; cursor:pointer;
  }
  .lingua:hover,.tema:hover{color:var(--text-body)}

  /* ══ IL TELEFONO: testata affiancata e il resto centrato ═══════════════════
     Disegno scelto dall'utente il 2026-09-02 fra tre mockup. In testa l'icona a
     sinistra e il titolo a destra su due righe allineate a sinistra; sotto,
     centrati, il tasto (più grande) e la riga tecnica su tre righe, poi l'immagine
     larga quanto il testo. Il claim e il paragrafo dell'installazione restano
     allineati a sinistra: sono gli unici due blocchi di testo lungo, e centrati
     si leggono peggio.
     ⚠️ QUI IL TESTO NON ENTRA NEL QUADRATO VUOTO, e va sopra l'immagine (regola qui
     sotto): su un telefono il quadrato è largo poco più di un terzo dello schermo, e la
     descrizione ci andrebbe a capo a ogni due parole. */
  /* ⚠️⚠️ LA SOGLIA DELL'INCASTRO È 960 E NON 880, ed è una misura (`Incastro`, coi
     caratteri veri): il testo è alto 452 pixel in tutte e due le lingue, e il quadrato
     vuoto è 479 a 912 di immagine, cioè da 960 di finestra in su; a 920 sarebbe 458, e il
     testo arriverebbe a 6 pixel dal pannello di sotto. Fra 880 e 960 il testo va sopra
     l'immagine con i corpi dello schermo largo. */
  @media (max-width:959px){
    .incastro{display:flex; flex-direction:column; gap:22px}
    /* La larghezza che il testo ha dentro il quadrato vuoto: senza, fra 880 e 960 la
       descrizione andrebbe su righe da centodieci caratteri. */
    .parole{width:auto; max-width:443px}
  }
  @media (max-width:880px){
    .testa{column-gap:16px}
    h1{font-size:30px; line-height:1.1}
    .claim{margin-top:18px}
    /* Il tasto e le tre righe sotto, centrati fra loro e nella colonna (Ritratto-03). */
    .blocco-scarica{flex-direction:column; align-items:center; gap:12px; margin-top:22px}
    .scarica{font-size:18px; padding:16px 30px; border-radius:14px; gap:10px}
    .scarica svg{width:20px; height:20px}
    .tecnica{text-align:center; line-height:1.8}
    .installa{margin-top:20px; max-width:none; font-size:13px}
    .sezione{padding-top:40px}
    .fatti{grid-template-columns:1fr; padding-top:20px}
  }
  @media (max-width:880px) and (orientation:portrait){
    .selezione{display:block; margin-top:24px}
  }
  /* ⚠️ IL TELEFONO GIRATO (Paesaggio-01, 2026-10-18): il blocco del tasto va a destra della
     descrizione, e l'immagine orizzontale sotto sbuca dal fondo del primo schermo, così si
     capisce che la pagina continua. La condizione è sull'altezza e non sulla larghezza,
     perché un telefono in orizzontale può essere largo più di 880 pixel; è la stessa del
     `<source>` della testata. Viene dopo le regole sopra e le scavalca anche oltre i 960,
     dove altrimenti ci sarebbe l'incastro con un'immagine che non ha il quadrato vuoto. */
  @media (orientation:landscape) and (max-height:500px){
    .incastro{display:flex; flex-direction:column; gap:22px}
    .parole{
      width:auto; max-width:none; display:grid; align-items:center; column-gap:32px;
      grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"testa testa" "claim scarica";
    }
    .testa{grid-area:testa}
    .claim{grid-area:claim}
    .blocco-scarica{grid-area:scarica; flex-direction:column; align-items:center; gap:12px; margin-top:18px}
    .tecnica{text-align:center}
  }
</style>
</head>
<body>

<main class="foglio">
  <div class="alto">
    <div class="incastro">
      <div class="parole">
      <div class="testa">
        <!-- L'icona dell'app, e il tracciato è QUELLO VERO, copiato da
             `res/drawable/ic_launcher_foreground.xml`: il disco e la A col tratto
             già incorporato nel contorno e il controcampo tenuto aperto da
             `evenodd`. È nelle coordinate del master, cioè senza la scala 0,65
             del drawable, perché quella serve solo a un'icona adattiva, di cui si
             vedono i 72dp centrali su 108; qui la piastrella si vede tutta.
             ⚠️ La coppia di colori segue il tema come l'icona vera, che ha una
             `values-night/` sua: non si fissa il glifo chiaro. -->
        <svg class="icona" viewBox="0 0 108 108" width="88" height="88" aria-hidden="true">
          <rect width="108" height="108" fill="var(--accent)"></rect>
          <path d="M30,19a10,10 0 1,0 0,20a10,10 0 1,0 0,-20z" fill="var(--glyph)"></path>
          <path fill="var(--glyph)" fill-rule="evenodd" d="M58.1311,27.1833L88.1311,71.1833A5,5 0 0 1 84,79L24,79A5,5 0 0 1 19.8689,71.1833L49.8689,27.1833A5,5 0 0 1 58.1311,27.1833ZM56.0424,49.5583L68.0424,66.5583A2.5,2.5 0 0 1 66,70.5L42,70.5A2.5,2.5 0 0 1 39.9576,66.5583L51.9576,49.5583A2.5,2.5 0 0 1 56.0424,49.5583Z"></path>
        </svg>
        <h1>Astonishing Image Viewer</h1>
      </div>
        <p class="claim" id="claim"></p>
        <div class="blocco-scarica">
          <a class="scarica" id="scarica" href="https://github.com/Roccobot/AIV-releases/releases/latest" download target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M12 3.5v11.2M12 15.6l4.4-4.4M12 15.6L7.6 11.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              <path d="M4.4 18.8h15.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
            <span id="scarica-testo"></span>
          </a>
          <div class="tecnica" id="tecnica"></div>
        </div>
      </div>

      <!-- Le immagini vere dell'app, mandate dall'utente: una per il tema chiaro e una
           per lo scuro, e dal 2026-10-18 ogni tema della pagina mostra quella del tema
           OPPOSTO (la nota su `.schermata-blocco img` dice perché): un `<source>` scuro
           punta alle immagini `-chiara`, e l'`img` di partenza a quelle `-scura` (dal 2026-10-18 le due della testata incastrata, `desktop-*`,
           ricavate in WebP dai PNG originali da 2530 pixel che lui ha mandato in uno ZIP;
           prima, dal 2026-09-02, la schermata di un telefono, `chiara` e `scura`, che
           restano in `publish/schermate/` perché ne legge una `tools/og-image.py`).
           ⚠️ UN <picture> E NON DUE <img> NASCOSTI A TURNO: così il browser ne
           scarica UNA sola, e la sceglie prima di disegnare.
           ⚠️⚠️ **DA QUANDO C'È IL TASTO DEL TEMA, LA MEDIA QUERY QUI SOTTO NON BASTA
           PIÙ, e la nota che c'era diceva il contrario**: diceva che la media query e
           `data-theme` non possono divergere perché leggono la stessa preferenza di
           sistema. Era vero finché il tema seguiva SOLO il sistema. Con una scelta
           manuale i due divergono, e il risultato si vede: pagina scura e immagine
           chiara. Il rimedio è che `applicaTema()` riscrive l'attributo `media` di
           questo `<source>` (`all` per forzare lo scuro, `not all` per forzare il
           chiaro, la media query vera quando si segue il sistema), così a scegliere
           resta sempre il `<picture>` e non due `src` da tenere d'accordo.
           ⚠️ **La media query RESTA scritta qui nel sorgente**, e non si parte da
           `not all`: chi segue il sistema, che è il caso di fabbrica, deve avere
           l'immagine giusta già in fase di analisi del documento, prima che lo script
           giri. Se partisse da un valore neutro, quel visitatore vedrebbe
           l'immagine sbagliata per un istante, o due immagini scaricate invece di una.
           ⚠️ **Una per tema e non una per lingua, per scelta dichiarata dell'utente**
           (2026-09-03): *non ho intenzione di produrre 4 screenshot ogni volta che si
           può mettere in vetrina una funzionalità nuova*. Le immagini del 2026-10-18
           hanno le etichette dell'app in inglese (`8 elements`), e la pagina italiana
           le mostra così.
           ⚠️ Vivono in `publish/schermate/`, che `pages.yml` copia intera accanto alla
           pagina.
           ⚠️⚠️ **SUL TELEFONO LA TESTATA HA UN'ALTRA IMMAGINE**, dal 2026-10-18 (sue scelte
           Ritratto-03 e Paesaggio-01): sotto gli 880 pixel, e col telefono girato (in
           orizzontale e non più alto di 500), le due `orizzontale-*`, l'elenco delle
           cartelle accanto alla griglia; in verticale le `verticale-*` vanno all'inizio di
           Organizza. Le condizioni sono le stesse delle regole CSS del telefono, e chi ne
           cambia una cambi l'altra. Un `<source>` col tema scuro porta in `data-scuro` la
           sua condizione senza il tema, che `applicaTema()` usa per forzarlo. -->
      <div class="schermata-blocco">
        <picture>
          <source data-scuro="(max-width:880px), (orientation:landscape) and (max-height:500px)" srcset="schermate/orizzontale-chiara.webp" width="2530" height="1200" media="(max-width:880px) and (prefers-color-scheme: dark), (orientation:landscape) and (max-height:500px) and (prefers-color-scheme: dark)">
          <source srcset="schermate/orizzontale-scura.webp" width="2530" height="1200" media="(max-width:880px), (orientation:landscape) and (max-height:500px)">
          <source data-scuro="all" srcset="schermate/desktop-chiara.webp" media="(prefers-color-scheme: dark)">
          <img id="schermata" src="schermate/desktop-scura.webp" width="2530" height="2530" alt="">
        </picture>
      </div>
    </div>

    <div class="fatto">
      <!-- ⚠️ LA SCACCHIERA È UN GLIFO COME GLI ALTRI dal 2026-09-02, e prima era un

      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><defs><clipPath id="clip-scacchiera"><rect x="4.9" y="4.9" width="14.2" height="14.2" rx="1.5"></rect></clipPath></defs><g clip-path="url(#clip-scacchiera)"><path d="M4.9 4.9h7.1v7.1h-7.1zM12 12h7.1v7.1h-7.1z" fill="currentColor"></path></g><rect x="4" y="4" width="16" height="16" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"></rect></svg>

      <div class="testi"><div class="titolo" data-t="f1"></div><div class="corpo" data-c="f1"></div></div>

  <section class="sezione">

    <p class="intro" data-i="s1"></p>
  <div class="fatti">

  <section class="sezione">
    <h2 data-s="s2"></h2>
    <p class="intro" data-i="s2"></p>
    <!-- La selezione in corso, solo sul telefono in verticale (Ritratto-03): `loading="lazy"`
         fa sì che altrove, dove il blocco non si vede, l'immagine non si scarichi. -->
    <div class="schermata-blocco selezione">
      <picture>
        <source data-scuro="all" srcset="schermate/verticale-chiara.webp" media="(prefers-color-scheme: dark)">
        <img id="schermata-selezione" src="schermate/verticale-scura.webp" width="1200" height="2530" loading="lazy" alt="">
      </picture>
    </div>
  <div class="fatti">
    <div class="fatto">
      <!-- Rinomina in blocco: il campo col cursore. -->
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3.2" y="6.8" width="17.6" height="10.4" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"></rect><path d="M12 9.6v4.8M10.4 9.6h3.2M10.4 14.4h3.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <div class="testi"><div class="titolo" data-t="f9"></div><div class="corpo" data-c="f9"></div></div>
    </div>
    <div class="fatto">
      <!-- Esporta/Converti: le due frecce che si scambiano. Prima di Cartelle preferite dal
           2026-10-18, su richiesta dell'utente; le chiavi `f10` e `f11` non cambiano. -->
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4.8 8.8h13.6M15.2 5.2l3.6 3.6-3.6 3.6M19.2 15.2H5.6M8.8 11.6l-3.6 3.6 3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div class="testi"><div class="titolo" data-t="f11"></div><div class="corpo" data-c="f11"></div></div>
    </div>

  function linguaIniziale() {

      : [navigator.language || 'en'];
    for (var i = 0; i < tags.length; i++) {

  function el(id) { return document.getElementById(id); }

  /*
   * Lega ogni parola di una o due lettere alla parola dopo, con uno spazio unificatore, perché
   * nessuna riga di un paragrafo finisca con un articolo, una preposizione o una congiunzione
   * corta (regola universale sulle parole sole a un capo della frase). È la stessa cosa che fa
   * `tie_after` nel generatore del documento di feedback.
   * ⚠️ Si ripete finché cambia qualcosa: in 'e la' due parole corte di fila si legano tutte e
   * due, e una sola passata della regex salterebbe la seconda.
   * Lega anche la prima parola di una frase, o di quello che segue i due punti, alla parola
   * dopo quando è sotto i 7 caratteri: senza, `Solo` o `basta` restano appese in fondo a una
   * riga (2026-10-18, misurato a 390 e 1280 px dopo i testi nuovi delle schede).
   */
  function lega(testo) {
    var prima;
    do {
      prima = testo;
      testo = testo.replace(/(^|[\s ])([^\s ]{1,2}) /g, '$1$2 ');
    } while (testo !== prima);
    return testo.replace(/([.!?:] )(\S{1,6}) /g, '$1$2 ');

   * differenza fra 'seguo il sistema' e 'ho scelto io': con un booleano non si

  function temaInVigore() {
    return stato.scelto || (mqScuro.matches ? 'dark' : 'light');

   * Mette in vigore il tema: l'attributo sul documento e la schermata dell'app.

   * ⚠️⚠️ **LA SCHERMATA SI STERZA RISCRIVENDO IL `media` DEL SUO `<source>`, e non

   * VINCE sull'`src` dell'`img`, quindi scrivere l'indirizzo a mano non avrebbe
   * avuto effetto finché la media query era soddisfatta. Riscrivendo `media` a
   * `all` o a `not all` si sposta la scelta senza toccare l'`img`, e a decidere
   * resta un posto solo. Provato in Chromium: il cambio di attributo rifà la
   * selezione e l'immagine cambia davvero.
   * ⚠️ **Finché nessuno ha scelto, il `media` resta la media query vera**, e non
   * un `all` calcolato: così chi segue il sistema ha esattamente il comportamento
   * di prima, deciso dal browser e non da questa funzione.

    var sorgenti = document.querySelectorAll('source[data-scuro]');

  }

  /* ── Il disegno della pagina, per la lingua in vigore ── */
  function disegna() {
    var T = TESTI[stato.lingua];
    var rel = stato.rel;
    var asset = rel && rel.asset;
    document.documentElement.lang = T.lang;

    el('claim').textContent = lega(T.claim);
    el('installa').textContent = T.installa;
    el('schermata').alt = T.schermataAlt;
    el('schermata-selezione').alt = T.selezioneAlt;

    // ⚠️ Il tasto porta all'apk della release; senza apk allegato porta alla
    // release stessa invece di rompersi, come chiede il brief.
    var tasto = el('scarica');
    el('scarica-testo').textContent = T.scarica + (rel ? ' ' + rel.tag : '');
    tasto.href = asset ? asset.browser_download_url
      : (rel ? rel.pagina : 'https://github.com/' + REPO + '/releases/latest');
    if (asset) tasto.setAttribute('download', ''); else tasto.removeAttribute('download');

    // ⚠️ Nome e peso ci sono SOLO se c'è l'apk allegato, e senza di lui la riga
    // si accorcia invece di riempirsi di trattini: prima nominava un file
    // ricavato dal tag, cioè un file che nessuno può scaricare.
    // ⚠️ PEZZI E SEPARATORI, e non una stringa sola: la riga va a capo prima di ogni
    // pezzo (richiesta dell'utente), e per farlo i pezzi devono essere nodi che il CSS
    // possa rendere blocchi. Fino alla 6.60 c'era anche il link 'codice sorgente', tolto
    // col repo privato (scelta Serratura-03-A).
    var tecnica = el('tecnica');
    svuota(tecnica);
    // ⚠️ La versione di Android porta una classe sua: è il pezzo meno importante, e
    // l'utente l'ha voluta un filo più trasparente degli altri.
    var righe = [];
    if (asset) righe.push([asset.name + ' \u00B7 ' + peso(asset.size, T.loc), '']);
    righe.push([T.android, ' minuta']);
    // ⚠️ La riga di Fiducia-01 è un pezzo della riga tecnica, l'ultimo: così va a capo come
    // gli altri sul telefono, e su schermo largo resta accanto al tasto senza un blocco suo.
    righe.push([T.fiducia, '']);
    for (var r = 0; r < righe.length; r++) {
      if (r) {
        var sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = ' \u00B7 ';
        tecnica.appendChild(sep);
      }
      var pz = document.createElement('span');
      pz.className = 'pezzo' + righe[r][1];
      if (typeof righe[r][0] === 'string') pz.textContent = righe[r][0]; else pz.appendChild(righe[r][0]);
      tecnica.appendChild(pz);
    }

    for (var f = 0; f < T.fatti.length; f++) {
      var titolo = document.querySelector('[data-t="f' + f + '"]');
      var corpo = document.querySelector('[data-c="f' + f + '"]');
      if (!titolo || !corpo) continue;
      titolo.textContent = lega(T.fatti[f][0]);
      corpo.textContent = lega(T.fatti[f][1]);
    }
    for (var s = 0; s < T.sezioni.length; s++) {
      var testa = document.querySelector('[data-s="s' + s + '"]');
      var intro = document.querySelector('[data-i="s' + s + '"]');
      if (!testa || !intro) continue;
      testa.textContent = T.sezioni[s][0];
      intro.textContent = lega(T.sezioni[s][1]);
    }

    var tastoLingua = el('lingua');
    tastoLingua.textContent = T.altra;
    tastoLingua.title = T.titoloAltra;

    // ⚠️ Etichetta e titolo nominano il tema OPPOSTO a quello in vigore, cioè
    // quello che si ottiene toccando: vedi la nota sopra `stato.scelto`.
    var altro = (temaInVigore() === 'dark') ? 'light' : 'dark';
    var tastoTema = el('tema');
    tastoTema.textContent = T.temi[altro];
    tastoTema.title = T.titoliTema[altro];
  }

  /* ── Una sola chiamata a GitHub, e da lì tutto il resto ── */
  function leggiRelease() {
    fetch('https://api.github.com/repos/' + REPO + '/releases?per_page=1', {
      headers: { Accept: 'application/vnd.github+json' }
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (elenco) {
      var ultima = elenco && elenco[0];
      if (!ultima) throw new Error('nessuna release');
      // ⚠️⚠️ L'APK si sceglie PER NOME, dalla 5.10: la release contiene anche quello di
      // AIV Play (`AIV-Play-x.xx.apk`), e il primo `.apk` dell'elenco può essere lui.
      var apk = null;
      var assets = ultima.assets || [];
      for (var i = 0; i < assets.length; i++) {
        if (/^AIV-[\d.]+\.apk$/i.test(assets[i].name)) { apk = assets[i]; break; }
      }
      stato.rel = {
        tag: String(ultima.tag_name || '').replace(/^v/i, ''),
        asset: apk,
        pagina: ultima.html_url
      };
      disegna();
    }).catch(function () {
      // ⚠️ Senza risposta la pagina NON si rompe e non lo dice: il tasto resta
      // quello che era prima della chiamata, cioè porta alla release più recente
      // su GitHub. Prima qui si accendeva `stato.rotto`, che serviva solo a
      // scrivere una riga nelle note di rilascio, e quelle non ci sono più.
    });
  }

  el('lingua').addEventListener('click', function () {
    stato.lingua = (stato.lingua === 'it') ? 'en' : 'it';
    disegna();
  });

  el('tema').addEventListener('click', function () {
    // ⚠️ Da qui in poi la pagina NON segue più il sistema, fino al ricaricamento.
    stato.scelto = (temaInVigore() === 'dark') ? 'light' : 'dark';
    applicaTema();
    // ⚠️ Serve anche `disegna`, e non solo `applicaTema`: l'etichetta nomina il
    // tema opposto a quello in vigore, quindi si scambia a ogni tocco.
    disegna();
  });

  /* T cambia il tema e L la lingua (richiesta dell'utente, 2026-10-11), senza
     modificatori e fuori dai campi, come il tasto T del documento di feedback.
     ⚠️ Premono i due tasti della pagina, che restano l'unico posto in cui tema e
     lingua cambiano; tenendo premuto non si ripetono. */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey || e.repeat || e.isComposing) return;
    var t = e.target;
    if (t && t.closest && (t.closest('input, textarea, select') || t.closest('[contenteditable]'))) return;
    var lettera = String(e.key).toLowerCase();
    var tasto = lettera === 't' ? 'tema' : (lettera === 'l' ? 'lingua' : null);
    if (!tasto) return;
    e.preventDefault();
    el(tasto).click();
  });

  applicaTema();
  disegna();
  leggiRelease();
})();
</script>

</body>
</html>
