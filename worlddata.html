<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>World rankings</title>
<style>

r:var(--sub);font-size:13.5px;text-wrap:pretty}.domain{color:var(--gray);font-size:12px;overflow-wrap:anywhere}.visit{display:inline-flex;gap:5px;align-items:center;text-decoration:none;color:var(--accent);font-weight:700;align-self:flex-start;margin-top:auto;word-break:break-word}.visit:hover{text-decoration:underline}button{cursor:pointer;background:#fff;border:1px solid #d3dae5;border-radius:10px;padding:11px 13px;font:inherit;color:var(--text)}button:hover{background:#f2f5f9}.empty{color:var(--sub);padding:40px 0;text-align:center}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101821;--surface:#192330;--text:#e8eef7;--sub:#abb8c8;--line:#2e3b4d;--accent:#9bbfff}header{background:radial-gradient(900px 320px at 50% -20%,#264c7f 0,transparent 70%),linear-gradient(120deg,#0d1c30,#1b3152)}input,select,button{background:#202c3b;color:var(--text);border-color:#3f4d60}button:hover{background:#2a3950}}@media(max-width:650px){main{padding:18px 13px 50px}header{padding:52px 18px 44px}.cards{grid-template-columns:1fr}.toolbar{position:static}.toolbar>*{width:100%;max-width:none}.count{margin:0}}
</style></head><body>
<header><div class="wrap"><h1 lang="en">World rankings</h1><p>Una raccolta ragionata di fonti internazionali: indici, ranking, statistiche, mappe e osservatori.</p></div></header>
<main><div class="toolbar"><input type="search" id="search" placeholder="Cerca per nome, argomento o dominio..." aria-label="Cerca risorse"><select id="category" aria-label="Filtra per categoria"><option value="">Tutte le categorie</option></select><button type="button" id="clear">Azzera filtri</button><span class="count" id="count"></span></div>
<div id="results"></div></main>
<script>
const data=[{"title":"ShanghaiRanking: ARWU","category":"Università e istruzione","url":"https://www.shanghairanking.com/","description":"Classifiche accademiche internazionali, incluse ARWU e ranking disciplinari."},{"title":"Atlas of Prejudice: Mapping Stereotypes","category":"Mappe, dati e visualizzazioni","url":"https://alphadesigner.com/mapping-stereotypes","description":"Mappe satiriche e stereotipi geografici di Yanko Tsvetkov."},{"title":"End Blasphemy Laws","category":"Democrazia, libertà e diritti","url":"https://end-blasphemy-laws.org/","description":"Campagna e panoramica delle leggi sulla blasfemia nei paesi del mondo."},{"title":"Corruption Perceptions Index: Transparency International","category":"Democrazia, libertà e diritti","url":"https://www.transparency.org/en/cpi/","description":"Indice di percezione della corruzione: accesso all'edizione corrente."},{"title":"Democracy Index (EIU): Our World in Data","category":"Democrazia, libertà e diritti","url":"https://ourworldindata.org/grapher/democracy-index-eiu","description":"Serie storiche dell'indice di democrazia dell'Economist Intelligence Unit."},{"title":"International IDEA: Democracy Tracker","category":"Democrazia, libertà e diritti","url":"https://www.idea.int/democracytracker/","description":"Monitoraggio degli eventi e dei cambiamenti democratici nei paesi."},{"title":"World Bank: Business Ready (B-READY)","category":"Economia, imprese e finanza","url":"https://www.worldbank.org/en/businessready","description":"Nuova iniziativa World Bank sul contesto normativo e operativo delle imprese."},{"title":"Index of Economic Freedom: Mappa","category":"Economia, imprese e finanza","url":"https://economicfreedom.heritage.org/pages/dataviz","description":"Visualizzazione geografica dei punteggi di libertà economica."},{"title":"EF English Proficiency Index","category":"Università e istruzione","url":"https://www.ef.com/wwen/epi/","description":"Classifica della competenza linguistica in inglese per /www.globalfirepower.com/","description":"Indice di capacità militare convenzionale: metodologia proprietaria."},{"title":"Global Hunger Index: Ranking","category":"Sviluppo, società e benessere","url":"https://www.globalhungerindex.org/ranking.html","description":"Classifica e indicatori della fame nel mondo."},{"title":"Pareto: Global Power Index","category":"Sicurezza, conflitti e rischi","url":"https://www.pareto-economics.com/global-power-index.html","description":"Valutazione quantitativa della capacità nazionale e delle sue componenti."},{"title":"Good Country Index: Risultati","category":"Sviluppo, società e benessere","url":"https://index.goodcountry.org/","description":"Misura dei contributi dei paesi al bene collettivo globale."},{"title":"Gun Violence Archive","category":"Sicurezza, conflitti e rischi","url":"https://www.gunviolencearchive.org/","description":"Dati e incidenti relativi alla violenza armata negli Stati Uniti."},{"title":"Happy Planet Index","category":"Sviluppo, società e benessere","url":"https://happyplanetindex.org/","description":"Benessere sostenibile, aspettativa di vita e impatto ambientale."},{"title":"Henley Passport Index: Ranking","category":"Mobilità, passaporti e viaggi","url":"https://www.henleyglobal.com/passport-index/ranking","description":"Classifica dei passaporti per destinazioni accessibili senza visto preventivo."},{"title":"Henley: Wealth Migration Country Benchmarking","category":"Economia, imprese e finanza","url":"https://www.henleyglobal.com/publications/henley-private-wealth-migration-dashboard/country-benchmarking","description":"Dati e confronti sulla mobilità patrimoniale e la migrazione di individui facoltosi."},{"title":"World Happiness Report","category":"Sviluppo, società e benessere","url":"https://www.worldhappiness.report/","description":"Rapporti e classifiche internazionali sul benessere soggettivo."},{"title":"UNDP: Country Insights","category":"Sviluppo, società e benessere","url":"https://hdr.undp.org/data-center/country-insights","description":"Schede e grafici sullo sviluppo umano per paese."},{"title":"Human Rights Watch","category":"Democrazia, libertà e diritti","url":"https://www.hrw.org/","description":"Ricerca e rapporti sulla situazione dei diritti umani."},{"title":"IDRlabs: Tests","category":"Mappe, dati e visualizzazioni","url":"https://www.idrlabs.com/tests.php","description":"Raccolta di test psicometrici e questionari."},{"title":"Il Sole 24 Ore: Qualità della vita","category":"Sviluppo, società e benessere","url":"https://lab24.ilsole24ore.com/qualita-della-vita/tabelle/","description":"Classifiche e indicatori della qualità della vita nelle province italiane."},{"title":"Mass Shooting Tracker","category":"Sicurezza, conflitti e rischi","url":"https://www.massshootingtracker.site/","description":"Database collaborativo di sparatorie di massa negli USA."},{"title":"Visual Capitalist: Nation Brands (2018)","category":"Economia, imprese e finanza","url":"https://www.visualcapitalist.com/ranking-nation-brands/","description":"Articolo storico del 2018 sul valore economico dei marchi-paese."},{"title":"OECD: Well-being Data Monitor","category":"Sviluppo, società e benessere","url":"https://www.oecd.org/en/data/tools/well-being-data-monitor.html","description":"Portale OCSE con indicatori comparabili del benessere."},{"title":"Our World in Data: Homepage","category":"Mappe, dati e visualizzazioni","url":"https://ourworldindata.org/","description":"Grafici e articoli basati su dati globali ad accesso libero."},{"title":"Passport Index: Arton Capital","category":"Mobilità, passaporti e viaggi","url":"https://www.passportindex.org/byRank.php","description":"Classifica dei passaporti e mobilità internazionale."},{"title":"Political Geography Now (PolGeoNow)","category":"Mappe, dati e visualizzazioni","url":"https://www.polgeonow.com/","description":"Mappe e analisi dei cambiamenti nei confini e negli equilibri territoriali."},{"title":"ILGA-Europe: Rainbow Map","category":"Democrazia, libertà e diritti","url":"https://rainbowmap.ilga-europe.org/","description":"Mappa e indice delle leggi e delle politiche LGBTI in Europa."},{"title":"RankingRoyals","category":"Mappe, dati e visualizzazioni","url":"https://rankingroyals.com/","description":"Raccolta di graduatorie, visualizzazioni e statistiche internazionali."},{"title":"Social Progress Imperative","category":"Sviluppo, società e benessere","url":"https://www.socialprogress.org/","description":"Social Progress Index e strumenti di analisi sociale e ambientale."},{"title":"Visual Capitalist: Most Trusted Made-in Labels (2026)","category":"Economia, imprese e finanza","url":"https://www.visualcapitalist.com/ranked-the-worlds-most-trusted-made-in-labels/","description":"Confronto dei marchi 'Made in' per reputazione e fiducia."},{"title":"International SOS: Travel Risk Map","category":"Sicurezza, conflitti e rischi","url":"https://www.internationalsos.it/risorse/risk-outlook-e-risk-map","description":"Mappa 2026 dei rischi medici e di sicurezza per i paesi."},{"title":"U.S. News: Best Countries","category":"Sviluppo, società e benessere","url":"https://www.usnews.com/news/best-countries","description":"Classifiche internazionali Best Countries."},{"title":"V-Dem: Varieties of Democracy","category":"Democrazia, libertà e diritti","url":"https://v-dem.net/","description":"Dataset, rapporti e strumenti sulla democrazia multidimensionale."},{"title":"VisaIndex: Passport Index","category":"Mobilità, passaporti e viaggi","url":"https://visaindex.com/#","description":"Classifica dei passaporti e informazioni sui visti."},{"title":"Reporters Without Borders: Press Freedom Index","category":"Democrazia, libertà e diritti","url":"https://rsf.org/en/ranking","description":"Classifica internazionale sulla libertà di stampa."},{"title":"World Resources Institute: Risorse","category":"Ambiente e sostenibilità","url":"https://www.wri.org/resources","description":"Ricerche, strumenti e dati su clima, energia, foreste e ambiente."},{"title":"Times Higher Education: University Rankings","category":"Università e istruzione","url":"https://www.timeshighereducation.com/world-university-rankings","description":"Classifiche internazionali delle università."}];
const catorder=["Democrazia, libertà e diritti", "Sviluppo, società e benessere", "Economia, imprese e finanza", "Sicurezza, conflitti e rischi", "Mobilità, passaporti e viaggi", "Università e istruzione", "Ambiente e sostenibilità", "Mappe, dati e visualizzazioni"];
const el=id=>document.getElementById(id);
const h=(tag,props,...kids)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(props||{}))n.setAttribute(k,v);for(const c of kids.flat())if(c!=null)n.append(c);return n};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};
function card(x){return h('article',{class:'card'},h('h3',null,x.title),h('p',null,x.description),h('span',{class:'domain'},host(x.url)),h('a',{class:'visit',href:x.url,target:'_blank',rel:'noopener noreferrer'},'Apri risorsa ',h('span',{'aria-hidden':'true'},'\u2197')))}
function render(){const q=el('search').value.trim().toLocaleLowerCase('it'),c=el('category').value;const filtered=data.filter(x=>(!c||x.category===c)&&(!q||[x.title,x.description,x.category,x.url].some(y=>y.toLocaleLowerCase('it').includes(q))));el('count').textContent=`${filtered.length} / ${data.length} risorse`;const groups=catorder.map(cat=>{const group=filtered.filter(x=>x.category===cat);return group.length?h('section',{class:'group'},h('div',{class:'grouphead'},h('h2',null,cat),h('span',null,group.length+' risorse')),h('div',{class:'cards'},group.map(card))):null}).filter(Boolean);el('results').replaceChildren(...(groups.length?groups:[h('p',{class:'empty'},'Nessuna risorsa corrisponde ai filtri.')]))}
catorder.forEach(cat=>{const o=document.createElement('option');o.value=cat;o.textContent=cat;el('category').appendChild(o)});
for(const id of ['search','category'])el(id).addEventListener(id==='search'?'input':'change',render);
el('clear').addEventListener('click',()=>{el('search').value='';el('category').value='';render();el('search').focus()});render();
</script></body></html>
