<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RatioLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // Theme driven by a .dark class on <html>: initialized from the system
            // preference, temporarily flipped with the hidden T shortcut
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    borderRadius: {
                        'pill': '9999px',
                    },
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    }
                }
            }
        }
    </script>
    <script>
        // Start from the system theme; no preference is ever stored, so a
        // refresh always returns to what the OS is set to
        (function () {
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            document.documentElement.classList.toggle('dark', mq.matches);
            document.documentElement.style.colorScheme = mq.matches ? 'dark' : 'light';
        })();
    </script>
    <style>
        .pill-input {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }
        .pill-input:focus {
            outline: none;
            /* !important: beats the Tailwind dark:border-* utility injected after this block */
            border-color: #5E60E4 !important;
        }
        /* Custom styled radio buttons */
        .radio-custom {
            accent-color: #4f46e5;
        }
        .radio-custom:checked + label {
            font-weight: 600;
            color: #4f46e5;
        }
        
        /* Orientation Box Transition */
        #orientationBox {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Decimal separators (punto / virgola) slightly larger so they stay visible */
        .dec-sep {
            font-size: 1.35em;
            font-weight: 900;
            line-height: 0;
        }

        /* Clickable numbers: click/tap copies them */
        .copyable {
            cursor: pointer;
            transition: opacity 0.15s ease;
            touch-action: manipulation;
        }
        .copyable:hover {
            opacity: 0.6;
        }

        /* Suppress the long-press callout (right-click is disabled) */
        html, body {
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex flex-col justify-between font-sans antialiased select-none">

    <header class="w-full pt-12 pb-6 flex flex-col items-center justify-center">
        <!-- Geometric Minimalist Logo -->
        <div class="relative w-16 h-16 mb-4">
            <div class="absolute inset-0 bg-brand-500 rounded-xl opacity-80 mix-blend-multiply dark:mix-blend-screen transform rotate-12 scale-90"></div>
            <div class="absolute inset-0 bg-indigo-400 rounded-full opacity-80 mix-blend-multiply dark:mix-blend-screen transform -translate-x-2 translate-y-2"></div>
            <div class="absolute inset-0 border-4 border-slate-900 dark:border-white rounded-lg transform -rotate-6"></div>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tighter text-slate-900 dark:text-white">
            RatioLab
        </h1>
        <div class="mt-1 flex items-baseline gap-2 text-sm tracking-wide text-slate-500 dark:text-slate-400">
            <!-- Project version (SlimVer): written by the script from its single source.
                 It comes before the link on purpose: right after it, the number reads as
                 the version of roccobot.me rather than the one of this page. -->
            <span id="versione" class="text-xs opacity-70"></span>
            <a href="https://roccobot.me/" target="_blank" rel="noopener" tabindex="-1"
                class="font-sans hover:text-brand-500 dark:hover:text-brand-400 transition-colors">
                roccobot.me
            </a>
        </div>
    </header>

    <main class="w-full max-w-2xl mx-auto px-6 flex-1 flex flex-col items-center mt-4">
        
        <!-- Input Pair -->
        <div class="flex items-center justify-center gap-4 sm:gap-6 w-full mb-10">
            <!-- Input 1 -->
            <div class="flex-1 max-w-[200px]">
                <input 
                    type="text" 
                    id="num1" 
                    placeholder="16" 
                    maxlength="5"
                    inputmode="decimal"
                    autocomplete="off"
                    class="pill-input w-full text-4xl sm:text-5xl font-semibold h-20 sm:h-24 rounded-pill border-4 border-slate-900 dark:border-slate-100 bg-transparent text-slate-900 dark:text-slate-100 placeholder-slate-300 dark:placeholder-slate-700 tracking-wider"
                />
            </div>

            <!-- Colon Symbol ':' + swap button -->
            <div class="relative flex items-center justify-center h-20 sm:h-24">
                <span id="colon" class="text-6xl sm:text-7xl font-black text-slate-900 dark:text-slate-100 leading-none">
                    :
                </span>
                <button id="swapBtn" type="button" tabindex="-1" title="Scambia i valori" aria-label="Scambia i valori"
                    class="absolute left-1/2 -translate-x-1/2 top-full mt-1 text-xl sm:text-2xl leading-none text-slate-400 dark:text-slate-500 hover:text-brand-500 dark:hover:text-brand-400 active:scale-90 transition-all duration-150 cursor-pointer">
                    &#8596;&#xFE0E;
                </button>
            </div>

            <!-- Input 2 -->
            <div class="flex-1 max-w-[200px]">
                <input 
                    type="text" 
                    id="num2" 
                    placeholder="9" 
                    maxlength="5"
                    inputmode="decimal"
                    autocomplete="off"
                    class="pill-input w-full text-4xl sm:text-5xl font-semibold h-20 sm:h-24 rounded-pill border-4 border-slate-900 dark:border-slate-100 bg-transparent text-slate-900 dark:text-slate-100 placeholder-slate-300 dark:placeholder-slate-700 tracking-wider"
                />
            </div>
        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="w-full text-center flex flex-col items-center justify-start opacity-0 transition-opacity duration-300 pointer-events-none">
            
            <!-- Line 1: Huge Simplified Fraction -->
            <div id="rowSimplified" class="copyable text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-4" title="Clicca per copiare">
                <!-- e.g. 5:4 -->
            </div>

            <!-- Line 2: Actual decimal ratio + Nearest Standard + Deviation -->
            <div id="rowDetails" class="text-xl sm:text-2xl font-mono text-slate-600 dark:text-slate-300 mb-8 flex items-center gap-3">
                <!-- e.g. 2,71:1 → ~3:1 +9,5% -->
            </div>

            <!-- Line 3: CSS Visual Orientation Box -->
            <div class="h-36 flex items-center justify-center w-full">
                <div id="orientationBox" class="border-4 border-slate-900 dark:border-white rounded-xl bg-slate-200/50 dark:bg-slate-800/50"></div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-3xl mx-auto p-6 flex flex-col items-center gap-4 text-sm text-slate-500 dark:text-slate-400">
        <!-- Decimal Separator Selector -->
        <div class="flex items-center gap-3 bg-slate-200/60 dark:bg-slate-800/60 px-4 py-2 rounded-full">
            <div class="flex items-center gap-1">
                <input type="radio" id="sepComma" name="decimalSep" value="," checked tabindex="-1" class="radio-custom cursor-pointer w-4 h-4">
                <label for="sepComma" class="cursor-pointer mr-2 text-xl font-bold leading-none"> , </label>
            </div>
            <div class="flex items-center gap-1">
                <input type="radio" id="sepDot" name="decimalSep" value="." tabindex="-1" class="radio-custom cursor-pointer w-4 h-4">
                <label for="sepDot" class="cursor-pointer text-xl font-bold leading-none"> . </label>
            </div>
        </div>
    </footer>

    <!-- Copy feedback toast -->
    <div id="copyToast" class="fixed left-1/2 bottom-8 -translate-x-1/2 px-4 py-2 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-sm font-semibold shadow-lg opacity-0 transition-opacity duration-200 pointer-events-none z-50"></div>

    <script>
        // Project version (SlimVer x.xx), single source: the page prints it under the
        // title, and a curl for `const VERSIONE` is the deploy probe. See CLAUDE.md.
        const VERSIONE = '1.01';

        // Core standard ratios to snap to (between 1:2 and 2:1)
        const BASE_STANDARD_RATIOS = [
            { w: 1, h: 1 },
            { w: 5, h: 4 }, { w: 4, h: 5 },
            { w: 4, h: 3 }, { w: 3, h: 4 },
            { w: 3, h: 2 }, { w: 2, h: 3 },
            { w: 16, h: 9 }, { w: 9, h: 16 },
            { w: 2, h: 1 }, { w: 1, h: 2 }
        ];

        // Elements
        const input1 = document.getElementById('num1');
        const input2 = document.getElementById('num2');
        const outputContainer = document.getElementById('outputContainer');
        const rowSimplified = document.getElementById('rowSimplified');
        const rowDetails = document.getElementById('rowDetails');
        const orientationBox = document.getElementById('orientationBox');
        const sepRadios = document.querySelectorAll('input[name="decimalSep"]');

        document.getElementById('versione').textContent = VERSIONE;

        let currentSeparator = ',';

        // Update separator preference without losing current inputs
        sepRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const oldSep = currentSeparator;
                currentSeparator = e.target.value;
                [input1, input2].forEach(inp => {
                    if (inp.value) inp.value = inp.value.replace(oldSep, currentSeparator);
                });
                calculate();
            });
        });

        // Input sanitization: numbers and chosen separator only
        function sanitizeInput(e) {
            let input = e.target;
            let value = input.value;
            
            // Unify separators to current choice
            value = value.replace(/[.,]/g, currentSeparator);

            // Keep only one separator
            let parts = value.split(currentSeparator);
            if (parts.length > 2) {
                value = parts[0] + currentSeparator + parts.slice(1).join('');
            }
            
            // Filter invalid chars
            const allowedRegex = new RegExp(`[^0-9\\${currentSeparator}]`, 'g');
            value = value.replace(allowedRegex, '');

            // Max length 5
            if (value.length > 5) value = value.substring(0, 5);

            input.value = value;
            calculate();
        }

        // Add event listeners to inputs
        [input1, input2].forEach(inp => {
            inp.addEventListener('input', sanitizeInput);
            inp.addEventListener('keydown', (e) => {
                if (e.key === '.' || e.key === ',') {
                    e.preventDefault();
                    let start = inp.selectionStart;
                    let end = inp.selectionEnd;
                    let val = inp.value;
                    if (!val.includes(currentSeparator) && val.length < 5) {
                        inp.value = val.substring(0, start) + currentSeparator + val.substring(end);
                        inp.setSelectionRange(start + 1, start + 1);
                        sanitizeInput(e);
                    }
                }
            });
        });

        // Swap button: exchanges the two values and recalculates
        const swapBtn = document.getElementById('swapBtn');
        swapBtn.addEventListener('click', () => {
            [input1.value, input2.value] = [input2.value, input1.value];
            calculate();
        });

        // Greatest Common Divisor
        function gcd(a, b) {
            return b < 0.00001 ? a : gcd(b, a % b);
        }

        // Float parsing localized
        function parseToFloat(str) {
            if (!str) return NaN;
            return parseFloat(str.replace(',', '.'));
        }

        // Formats number back to localized string with max decimals
        function formatNumber(num, maxDecimals = 2) {
            let str = num.toFixed(maxDecimals);
            if (str.includes('.')) str = str.replace(/\.?0+$/, ''); // trim trailing zeros
            return str.replace('.', currentSeparator);
        }

        function calculate() {
            const val1 = parseToFloat(input1.value);
            const val2 = parseToFloat(input2.value);

            if (isNaN(val1) || isNaN(val2) || val1 <= 0 || val2 <= 0) {
                outputContainer.classList.add('opacity-0');
                outputContainer.classList.add('pointer-events-none');
                return;
            }
            outputContainer.classList.remove('opacity-0');
            outputContainer.classList.remove('pointer-events-none');

            // --- 1. Huge Simplified Fraction ---
            const decimalPlaces = (v) => {
                const s = v.toString();
                return s.includes('.') ? s.length - s.indexOf('.') - 1 : 0;
            };
            const factor = Math.pow(10, Math.max(decimalPlaces(val1), decimalPlaces(val2)));
            let int1 = Math.round(val1 * factor);
            let int2 = Math.round(val2 * factor);
            const divisor = gcd(int1, int2);
            
            const simplifiedStr = `${Math.round(int1/divisor)}:${Math.round(int2/divisor)}`;
            rowSimplified.dataset.copy = simplifiedStr;
            writeNumber(rowSimplified, simplifiedStr);

            // --- 2. Decimal Ratio, Snapping & Deviation ---
            const isHorizontal = val1 >= val2;
            const primaryVal = isHorizontal ? val1 : val2;
            const secondaryVal = isHorizontal ? val2 : val1;
            
            // Actual Ratio (always represented as X:1 where X >= 1)
            const actualRatio = primaryVal / secondaryVal; 
            
            // Find target standard ratio
            let targetRatioStr = '';
            let targetRatioVal = 1;

            if (actualRatio > 2) {
                // Snap to nearest integer X:1
                const nearestInt = Math.round(actualRatio);
                targetRatioVal = nearestInt;
                targetRatioStr = isHorizontal ? `${nearestInt}:1` : `1:${nearestInt}`;
            } else {
                // Snap to predefined lists (convert all to >= 1 values for comparison)
                let minDiff = Infinity;
                let bestMatch = BASE_STANDARD_RATIOS[0];
                
                BASE_STANDARD_RATIOS.forEach(std => {
                    // Check if standard matches orientation, or if it's 1:1
                    const stdIsHoriz = std.w >= std.h;
                    if (stdIsHoriz === isHorizontal || std.w === std.h) {
                        const stdVal = stdIsHoriz ? (std.w / std.h) : (std.h / std.w);
                        const diff = Math.abs(actualRatio - stdVal);
                        if (diff < minDiff) {
                            minDiff = diff;
                            bestMatch = std;
                        }
                    }
                });
                
                targetRatioVal = isHorizontal ? (bestMatch.w / bestMatch.h) : (bestMatch.h / bestMatch.w);
                targetRatioStr = `${bestMatch.w}:${bestMatch.h}`;
            }

            // Real decimal representation (X:1 or 1:X)
            const formattedActual = formatNumber(actualRatio, 2);
            const actualStr = isHorizontal ? `${formattedActual}:1` : `1:${formattedActual}`;

            // Calculate percentage deviation: ((Actual / Target) - 1) * 100
            const deviationPercentage = ((actualRatio / targetRatioVal) - 1) * 100;
            const formattedDev = formatNumber(Math.abs(deviationPercentage), 2);
            const sign = deviationPercentage >= 0 ? '+' : '-';
            
            // Render line 2 completely neutral
            // Format: 19:7 → ~3:1  -9,52% (no percentage at all on an exact match)
            // Each number carries data-copy (raw text); the displayed copy gets
            // its decimal separator enlarged
            const isExactMatch = formattedDev === '0';
            const deviationStr = sign + formattedDev + '%';

            const arrow = document.createElement('span');
            arrow.className = 'text-slate-400 font-bold';
            arrow.textContent = '→';

            rowDetails.textContent = '';
            rowDetails.append(
                copyableNumber(actualStr, 'copyable'),
                arrow,
                copyableNumber(targetRatioStr, 'copyable text-brand-500 dark:text-brand-400', `~${targetRatioStr}`)
            );
            if (!isExactMatch) {
                rowDetails.append(copyableNumber(
                    deviationStr,
                    'copyable ml-2 px-2 py-1 rounded bg-slate-200 dark:bg-slate-800 text-sm'
                ));
            }

            // --- 3. CSS Visual Orientation Box ---
            // Fitted inside a fixed bounding area so it can never spill over
            // neighbouring elements, even on narrow screens
            const MAX_W = 288; // CSS px
            const MAX_H = 144; // CSS px
            // Cap extreme ratios to avoid degenerate slivers
            const visualRatio = Math.min(actualRatio, 6);

            let boxW, boxH;
            if (isHorizontal) {
                boxW = Math.min(MAX_W, MAX_H * visualRatio);
                boxH = boxW / visualRatio;
            } else {
                boxH = Math.min(MAX_H, MAX_W * visualRatio);
                boxW = boxH / visualRatio;
            }

            orientationBox.style.width = `${Math.round(boxW)}px`;
            orientationBox.style.height = `${Math.round(boxH)}px`;
        }

        // Render '.'/',' separators a bit larger inside formatted numbers.
        // Nodes are composed, never assigned as innerHTML: that is the house rule, and
        // these strings carry values typed into the two fields.
        function separatorNodes(str) {
            const frag = document.createDocumentFragment();
            let plain = '';
            for (const ch of str) {
                if (ch !== '.' && ch !== ',') { plain += ch; continue; }
                if (plain) { frag.append(plain); plain = ''; }
                const sep = document.createElement('span');
                sep.className = 'dec-sep';
                sep.textContent = ch;
                frag.append(sep);
            }
            if (plain) frag.append(plain);
            return frag;
        }

        // Replaces an element's content with that same text, separators enlarged
        function writeNumber(el, str) {
            el.textContent = '';
            el.append(separatorNodes(str));
        }

        // A number that can be copied with a click: the raw text goes in data-copy,
        // which the delegated listener reads
        function copyableNumber(str, classes, shown) {
            const span = document.createElement('span');
            span.className = classes;
            span.dataset.copy = str;
            span.title = 'Clicca per copiare';
            if (shown === undefined) span.append(separatorNodes(str));
            else span.textContent = shown;
            return span;
        }

        // Copy feedback toast
        const copyToast = document.getElementById('copyToast');
        let toastTimer = null;
        function showToast(message) {
            copyToast.textContent = message;
            copyToast.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => copyToast.classList.add('opacity-0'), 1400);
        }

        // Click/tap on any displayed number copies it (delegated: survives re-renders)
        document.addEventListener('click', (e) => {
            const target = e.target.closest('[data-copy]');
            if (target) copyText(target.dataset.copy);
        });

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(`Copiato: ${text}`);
            } catch (err) {
                // Fallback for contexts where the async clipboard API is unavailable
                const helper = document.createElement('textarea');
                helper.value = text;
                helper.setAttribute('readonly', '');
                helper.style.cssText = 'position:fixed;opacity:0;user-select:text;-webkit-user-select:text;';
                document.body.appendChild(helper);
                helper.select();
                const ok = document.execCommand('copy');
                helper.remove();
                showToast(ok ? `Copiato: ${text}` : 'Copia non riuscita');
            }
        }

        // Right-click disabled
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // Tab navigation loops ONLY between the two input fields, in both
        // directions; every other element is skipped entirely
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Tab') return;
            e.preventDefault();
            const focusField = (inp) => { inp.focus(); inp.select(); };
            if (e.shiftKey) {
                focusField(document.activeElement === input1 ? input2 : input1);
            } else {
                focusField(document.activeElement === input2 ? input1 : input2);
            }
        });

        // Hidden shortcut: T (no modifiers) flips the theme for this session only.
        // Nothing is stored — a refresh goes back to the system theme.
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        let themeOverride = null; // null = follow the system

        function applyTheme() {
            const dark = themeOverride === null ? prefersDark.matches : themeOverride === 'dark';
            document.documentElement.classList.toggle('dark', dark);
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        }

        prefersDark.addEventListener('change', () => {
            if (themeOverride === null) applyTheme();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 't' && e.key !== 'T') return;
            if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
            const tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
            themeOverride = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
            applyTheme();
        });

        // Vertically centre the ':' ink on the two fields.
        //
        // Flexbox centres the span's line box, not the glyph inside it: the ':' ink
        // runs from the baseline up to about half the x-height, so it sits below the
        // middle of the box and the symbol reads lower than the numbers beside it.
        // The gap is (fontAscent - fontDescent)/2 - (inkAscent - inkDescent)/2, which
        // does not depend on the line height but does depend on the font metrics, so
        // it is measured on the font the browser actually picked. The result is a
        // ratio of the font size, written in em so it holds at both type sizes.
        function centreColon() {
            const el = document.getElementById('colon');
            if (!el) return;
            const style = getComputedStyle(el);
            const size = parseFloat(style.fontSize);
            if (!size) return;
            const ctx = document.createElement('canvas').getContext('2d');
            if (!ctx) return;
            ctx.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
            const m = ctx.measureText(':');
            const metrics = [
                m.fontBoundingBoxAscent, m.fontBoundingBoxDescent,
                m.actualBoundingBoxAscent, m.actualBoundingBoxDescent
            ];
            // Older engines omit the font bounding box: leave the glyph where it is.
            if (!metrics.every(Number.isFinite)) return;
            const drop = ((m.fontBoundingBoxAscent - m.fontBoundingBoxDescent)
                - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent)) / 2;
            el.style.transform = `translateY(${(-drop / size).toFixed(4)}em)`;
        }

        // Twice: now, so the symbol never shows uncentred, and again on load in case
        // the CDN stylesheet landed after this script and changed weight or family.
        centreColon();
        window.addEventListener('load', centreColon);

        // Initial setup focus
        window.addEventListener('DOMContentLoaded', () => {
            input1.focus();
        });
    </script>
</body>
</html>
