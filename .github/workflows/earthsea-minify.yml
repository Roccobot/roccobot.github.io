# Genera la pagina pubblicata di 'I Grandi di Terramare' (earthsea/top/index.html) dal suo
# sorgente commentato (earthsea/top/index.src.html), minificandola: i commenti erano il 61%
# del codice servito. Il sorgente è il solo file che si modifica.
#
# Il commit che produce è di github-actions[bot] e tocca il solo index.html: non riattiva
# questo workflow (il filtro sui percorsi lo esclude, e i push fatti col GITHUB_TOKEN non
# fanno partire altri workflow), ma fa partire il deploy di Pages come ogni push.
name: Terramare, pagina minificata

on:
  push:
    branches: [master]
    paths:
      - 'earthsea/top/index.src.html'
      - '.github/scripts/earthsea-minify.mjs'
      - '.github/workflows/earthsea-minify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthsea-minify
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa esbuild
        run: npm install --no-save --no-package-lock esbuild@0.28.2
      - name: Genera index.html
        run: node .github/scripts/earthsea-minify.mjs
      - name: Pubblica se è cambiato
        run: |
          if git diff --quiet -- earthsea/top/index.html; then
            echo "index.html già allineato al sorgente"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add earthsea/top/index.html
          git commit -m 'Terramare: index.html rigenerato dal sorgente'
          for i in 1 2 3 4; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((i * 5))
          done
          exit 1
